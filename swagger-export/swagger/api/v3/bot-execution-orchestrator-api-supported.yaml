    StopExecutions:
      type: object
      description: Stop an execution by providing the execution ID. This object is an array and you can provide multiple execution IDs.
      properties:
        execution_ids:
          type: array
          items:
            type: string
          example: [e5c8a404-0804-4448-ba89-56433db062c0, 3a19281a-5484-43c2-922e-e06be87f99d1, e5c8a404-0804-4448-ba89-56433db062c0]

    PauseExecutions:
      type: object
      description: Pause an execution by providing the execution ID. This object is an array and you can provide multiple execution IDs.
      properties:
        execution_ids:
          type: array
          items:
            type: string
          example: [e5c8a404-0804-4448-ba89-56433db062c0, 3a19281a-5484-43c2-922e-e06be87f99d1, e5c8a404-0804-4448-ba89-56433db062c0]

    ResumeExecutions:
      type: object
      description: Resume an execution by providing the execution ID. This object is an array and you can provide multiple execution IDs.
      properties:
        execution_ids:
          type: array
          items:
            type: string
          example: [e5c8a404-0804-4448-ba89-56433db062c0, 3a19281a-5484-43c2-922e-e06be87f99d1, e5c8a404-0804-4448-ba89-56433db062c0]

    ManageExecutionsRequest:
      type: object
      description: Manage your execution requests by providing one or more execution IDs. You can stop, resume, or pause an execution one at a time and cannot perform these operations simultaneously.
      properties:
        stop_executions:
          $ref: '#/components/schemas/StopExecutions'
        pause_executions:
          $ref: '#/components/schemas/PauseExecutions'
        resume_executions:
          $ref: '#/components/schemas/ResumeExecutions'
      oneOf:
        - required:
            - stop_executions
        - required:
            - pause_executions
        - required:
            - resume_executions

    ManageActionError:
      type: object
      properties:
        execution_id:
          type: string
          description: Execution ID of the job.
          example: "e5c8a404-0804-4448-ba89-56433db062c0"
        error_response:
          type: string
          description: Displays an error if the execution could not be stopped, paused, or resumed.
          example: "You do not have permission to view this execution or it is already terminated"

    ManageExecutionsResponse:
      type: object
      properties:
        requests_sent_to_device:
          type: array
          description: Device ID to which the execution request is sent to. This object is an array and you can provide multiple device IDs.
          items:
            type: string
          example: [d3c5d67e-cd45-4a50-9c7f-b2cefad9507c, 3a19281a-5484-43c2-922e-e06be87f99d1, e5c8a404-0804-4448-ba89-56433db062c0]
        manage_action_errors:
          type: array
          description: Displays information if there is an error during execution.
          items:
            $ref: '#/components/schemas/ManageActionError'
          
    DetailedError:
      type: object
      description: A detailed structure for error reporting, including localized message templates and parameters. This object provides a structured breakdown of the execution 'message' field for better parsing.
      properties:
        message:
          type: string
          description: A high-level, human-readable message, often indicating what caused the bot failure.
        details:
          type: string
          description: Specific, technical details about the cause of the error, such as the exact reason for the bot failure.
        correctiveAction:
          type: string
          description: Suggested steps the user can take to fix the error in future deployments.
        code:
          type: string
          description: Bot failure Error code.
        messageValues:
          type: array
          items:
            type: string
          description: A list of values used to populate variables in the message template (if applicable).
        detailsValues:
          type: array
          items:
            type: string
          description: A list of values used to populate variables in the details template (if applicable).
        correctiveActionValues:
          type: array
          items:
            type: string
          description: A list of values used to populate variables in the corrective action template (if applicable).
      example:
        message: "There was a problem at line 1\n"
        details: "This may be due to the following reason:\n\n    Expected RecordValue with schema but missing, given: com.automationanywhere.botcommand.data.impl.RecordValue@65d364ff\n\n"
        correctiveAction: "To continue, edit the bot and fix the error. Then, try again.\n\n\nIf you continue to see this message, please contact your system administrator."
        code: "bot.execution.error"
        messageValues: []
        detailsValues: []
        correctiveActionValues: []
