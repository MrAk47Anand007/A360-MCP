    Filter:
      description: "Filters the result based on operator, field, or value."
      oneOf:
        - $ref: '#/components/schemas/CompoundFilter'
        - $ref: '#/components/schemas/SimpleFilter'
        
      discriminator:
        propertyName: operator
        mapping:
          NONE: '#/components/schemas/SimpleFilter'
          lt: '#/components/schemas/SimpleFilter'
          le: '#/components/schemas/SimpleFilter'
          eq: '#/components/schemas/SimpleFilter'
          ne: '#/components/schemas/SimpleFilter'
          ge: '#/components/schemas/SimpleFilter'
          gt: '#/components/schemas/SimpleFilter'
          substring: '#/components/schemas/SimpleFilter'
          and: '#/components/schemas/CompoundFilter'
          or: '#/components/schemas/CompoundFilter'
          not: '#/components/schemas/CompoundFilter'
