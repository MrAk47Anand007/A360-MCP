          description: Filter value
          example: finance_workitem
        operator:
          type: string
          description: Operator for simple comparison.
          example: substring
          enum:
          - NONE
          - lt
          - le
          - eq
          - ne
          - ge
          - gt
          - substring
          
    CompoundFilter:
      type: object
      required:
        - operator
        - operands
      properties:
        operator:
          type: string
          description: Logical operator.
          enum:
