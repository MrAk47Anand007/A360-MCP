openapi: 3.0.1
info:
  title: Work Load Management (WLM) API
  description: |-
    Use the Workload Management (WLM) API to programmatically manage and create work item models, queues, work items, and automations in your Control Room. To create a Workload Management automation process, ensure that you are allocated the following roles and permissions: <li>AAE_Pool Admin role and View all devices permission</li> <li>AAE_Queue Admin role</li> <li>Run bot permission</li> <li>Run or schedule permission on the bots folder</li> <li>Device pool consumer permission</li>
    Mapping of UI to API status for workload management work item processing:<br> UI -  API<br> New  - NEW<br> Ready to Run - READY_TO_RUN<br> Active -  ACTIVE<br> Completed  - COMPLETED<br> Failed  - FAILED<br> On Hold  - ON_HOLD<br> Data error  - DATA_ERROR<br>

    All API calls must contain either an authentication token from Authentication API (generates JSON Web token) or a bearer token from OAuth services. You cannot use both together in an API.

    **Header:** `X-Authorization: <<authentication token>> or Authorization: Bearer <<bearer token>>`
  version: 2.0.0
servers:
- url: /v3/wlm
security:
- AccessToken: []
paths:
  /workitemmodels/list:
    post:
      tags:
      - WorkItemModels
      summary: Get all work item models
      description: |-
        Use this API to get a list of the work item models (also known as work item template or work item structure). Work item models can be associated with one or more queues.
        You can send an API request with or without filter parameters. An API request without any filter parameters specified, retrieves details of all the work items in the Control Room. You can use the filter parameters to retrieve specific work items. For more information, see [Filtering, pagination, and sorting](https://docs.automationanywhere.com/bundle/enterprise-v2019/page/enterprise-cloud/topics/control-room/control-room-api/cloud-api-filter-request.html).
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/FilterRequest'
        required: true
      responses:
        "200":
          description: Returns work item model array
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemModelList'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: body
  /workitemmodels:
    post:
      tags:
      - WorkItemModels
      summary: Create a work item model
      description: "Use this API to define a work item model for processing in a queue.\
        \ Work item model is the structure of a work item, it defines all the fields\
        \ along with their data types (string, numbers, and date etc)."
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/WorkItemModelWithoutId'
        required: true
      responses:
        "200":
          description: Return created work item model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemModel'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: true
      x-codegen-request-body-name: body
  /workitemmodels/{id}:
    get:
      tags:
      - WorkItemModels
      summary: Get specific work item model by ID
      description: Use this API to retrieve a specific work item model. You must specify
        the ID of the work item model.
      parameters:
      - name: id
        in: path
        description: model id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Returns model for given id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemModel'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: true
    delete:
      tags:
      - WorkItemModels
      summary: Delete a work item model by ID
      description: Use this API to delete a specific work item model. You must specify
        the ID of the work item model.
      parameters:
      - name: id
        in: path
        description: model id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Return 'nocontent'
          content:
            application/json:
              schema:
                type: string
                example: OK
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /queues:
    post:
      tags:
      - Queues
      summary: Create a queue
      description: Use this API to create a queue which is a container of work items.
        Ensure that you have the Create queues or AAE_Queue Admin permission.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQueue'
        required: true
      responses:
        "201":
          description: Return created queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: body
  /queues/delete:
    post:
      tags:
      - Queues
      summary: Delete multiple queues
      description: Use this API to delete multiple queues.You must specify the ID
        of the queues in an array.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
        required: true
      responses:
        "204":
          description: Return 'nocontent'
          content:
            application/json:
              schema:
                type: string
                example: OK
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: body
  /queues/export:
    post:
      tags:
      - Queues
      summary: Export queues to archive file
      description: Use this API to export queues to compressed file.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportQueueRequest'
        required: true
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportQueueResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: body
  /queues/import:
    post:
      tags:
      - Queues
      summary: Import queues
      description: "Use this API to import queues to the Control Room from a compressed\
        \ file. Choose a file location and a password if needed. If a file already\
        \ exists with the same name, you must specify if the file import must be skipped\
        \ or a copy must be imported."
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - actionIfExists
              - upload
              type: object
              properties:
                upload:
                  type: string
                  description: The file to upload
                  format: binary
                encryptedPassword:
                  type: string
                  description: Encrypted archive password
                actionIfExists:
                  type: string
                  description: Option to skip or overwrite existing queues
                  enum:
                  - SKIP
                  - COPY
        required: true
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportQueueResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /queues/export/download/status/{requestId}:
    get:
      tags:
      - Queues
      summary: Get Import/Export status by request ID
      description: Use this API to retrieve import or export status by specifying
        a request ID.
      parameters:
      - name: requestId
        in: path
        description: Specify the request ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Status of import or export queue retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /queues/export/download/{downloadFileId}:
    get:
      tags:
      - Queues
      summary: Download exported queues
      description: Use this API to download the exported queues by specifying the
        file ID.
      parameters:
      - name: downloadFileId
        in: path
        description: Use the Download file ID from the status API
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content: {}
        "400":
          description: Bad Request
          content:
            application/zip:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/zip:
              schema:
                $ref: '#/components/schemas/Error'
  /queues/{id}:
    get:
      tags:
      - Queues
      summary: Get queue by ID
      description: Use this API to retrieve a specific queue by specifying the queue
