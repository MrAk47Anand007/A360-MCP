          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: true
    put:
      tags:
      - Queues
      summary: Update queue
      description: Use this API to update an existing queue by specifying the queue
        ID.
      parameters:
      - name: id
        in: path
        description: Specify the queue ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
