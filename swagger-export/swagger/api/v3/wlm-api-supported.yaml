        required: true
      responses:
        "200":
          description: Return OK
          content: {}
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: body
    delete:
      tags:
      - Queues
      summary: Delete a queue by ID
      description: Use this API to delete a queue by specifying the queue ID.
      parameters:
      - name: id
        in: path
        description: Specify the queue ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: no content available
          content: {}
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /queues/list:
    post:
      tags:
      - Queues
      summary: List all queues
      description: |-
        Use this API to retrieve a list of all the queues.
        You can send an API request with or without filter parameters. An API request without any filter parameters specified, retrieves details of all the objects in the Control Room. You can use the filter parameters to retrieve specific set of file or folder objects, instead of fetching all objects in the Control Room. For more information, see [Filtering, pagination, and sorting](https://docs.automationanywhere.com/bundle/enterprise-v2019/page/enterprise-cloud/topics/control-room/control-room-api/cloud-api-filter-request.html).
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/FilterRequest'
        required: true
      responses:
        "200":
          description: A list of queues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueFilterResponse'
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: body
  /queues/{id}/consumers:
    get:
      tags:
      - Queues
      summary: Get queue consumers
      description: Use this API to retrieve roles that have access to view this queue
        and all the work items in the queue. You must specify the queue ID.
      parameters:
      - name: id
        in: path
        description: ID of the queue
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: An array of user roles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Queues
      summary: Add queue consumer
      description: Use this API to add a role as a queue consumer to access the queues
        by specifying the queue ID.
      parameters:
      - name: id
        in: path
        description: ID of the queue
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/RoleId'
        required: true
      responses:
        "201":
          description: Successful creation of queue consumer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueConsumers'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: true
      x-codegen-request-body-name: body
  /queues/{id}/consumers/{roleId}:
    delete:
      tags:
      - Queues
      summary: Remove queue consumer
      description: Use this API to remove a queue consumer so that they cannot use
        the queues. You must specify the queue ID and the role ID to remove the queue
        consumer.
      parameters:
      - name: id
        in: path
        description: ID of the queue
        required: true
        schema:
          type: integer
      - name: roleId
        in: path
        description: ID of the role
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: The queue consumer is removed successfully.
          content: {}
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /queues/{id}/participants:
    get:
      tags:
      - Queues
      summary: Get queue participants
      description: Use this API to retrieve all roles that can add workItems to the
        queue by specifying the queue ID.
      parameters:
      - name: id
        in: path
        description: ID of the queue
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: An array of user roles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Queues
      summary: Add queue participant
      description: Use this API to add a role as a queue participant by specifying
        the queue ID. The queue participants can add workItems to the queue.
      parameters:
      - name: id
        in: path
        description: ID of the queue
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/RoleId'
        required: true
      responses:
        "201":
          description: Successful creation of queue participant.
          content: {}
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: true
      x-codegen-request-body-name: body
  /queues/{id}/participants/{roleId}:
    delete:
      tags:
      - Queues
      summary: Remove queue participant
      description: Use this API to remove a queue participant so that they cannot
        add workItems in the queue. You must specify the queue ID and role ID to remove
        the queue participant.
      parameters:
      - name: id
        in: path
        description: ID of the queue
        required: true
        schema:
          type: integer
      - name: roleId
        in: path
        description: ID of the role
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: The queue participant is removed successfully.
          content: {}
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /queues/{id}/members:
    get:
      tags:
      - Queues
      summary: Get queue owner
      description: Use this API to retrieve all users who can add or remove credentials
        to the queue or edit the queue settings. You must specify the queue ID.
      parameters:
      - name: id
        in: path
        description: ID of the queue
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: An array of queue owners.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueMember'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /queues/{id}/members/{userId}:
    put:
      tags:
      - Queues
      summary: Add or update a queue member
      description: Use this API to add or update a queue member. Specify the queue
        ID and User ID to add or remove credentials to the queue or edit the queue
        settings.
      parameters:
      - name: id
        in: path
        description: ID of the queue
        required: true
        schema:
          type: integer
      - name: userId
        in: path
        description: ID of the user
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                permissions:
                  $ref: '#/components/schemas/QueueMemberPermissions'
        required: true
