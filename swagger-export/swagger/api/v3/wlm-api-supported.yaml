components:
  schemas:
    ExportQueueRequest:
      required:
      - exportName
      - includeWorkItems
      - queueIds
      type: object
      properties:
        exportName:
          type: string
          description: Export package name
          example: Finance Queue
        encryptedPassword:
          type: string
          description: Encrypted archive password
          example: 2R8vJNF5E5EfaTLxr3tWI7kjs+uBFYaIHnBRBdtEUdbLKRg5acLhH4I=
        includeWorkItems:
          type: boolean
          description: True if export archive should contain required workItems
          example: true
        queueIds:
          type: array
          description: Queue ids to export
          example:
          - 1
          - 2
          - 3
          items:
            type: integer
            description: Queue id
    ExportQueueResponse:
      required:
      - requestId
      type: object
      properties:
        requestId:
          type: string
          description: UUID that can be used to get status of export request.
          example: 19bea097-afab-467f-bd25-1270e4c6f716
    ImportQueueResponse:
      required:
      - requestId
      type: object
      properties:
        requestId:
          type: string
          description: UUID that can be used to get status of import request.
          example: 19bea097-afab-467f-bd25-1270e4c6f716
    StatusResponse:
      required:
      - downloadFileName
      - requestId
      - status
      - type
      type: object
      properties:
        requestId:
          type: string
          description: Queue Request ID.
          example: 50421ecb-9ce0-46e6-99ed-85ab623b5420
        type:
          type: string
          enum:
          - WORKITEM_EXPORT
        status:
          type: string
          enum:
          - IN_PROGRESS
          - COMPLETED
          - FAILED
        downloadFileName:
          type: string
          description: File name that is same as downloaded exported file
          example: /crdata/Server Files/wlm-files/workitems/4090a32b-79c1-4fd8-b88a-b1ea8c994cb0/72b676eb-2801-47cb-91ea-5f71f06df0ba/cr-work-items-20250714-095032.csv
        downloadFileId:
          type: string
          description: file identifier  that can be used to download exported file
          example: 72b676eb-2801-47cb-91ea-5f71f06df0ba
        errorMessage:
          type: string
          description: Shows error in case of failed operation.
          example: "null"
    WorkItemModelWithoutId:
      type: object
      properties:
        name:
          type: string
          description: Name of the workitem model
          example: Bonus Template
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/WorkItemModelAttributeWithoutId'
    WorkItemModel:
      type: object
      properties:
        id:
          type: number
          description: unique identifier
          example: 5.0
        name:
          type: string
          description: Name of the work item model
          example: Bonus Template
        createdBy:
          type: integer
          description: ID of the user who created the work item model.
          example: 27
        createdOn:
          type: string
          description: Date when the work item model was created in the ISO 8601 format.
          example: 2025-07-18T08:19:07.663681Z
        updatedBy:
          type: integer
          description: ID of the user who last updated the work item model.
          example: 29
        updatedOn:
          type: string
          description: Date when the work item model was last updated in the ISO 8601
            format.
          example: 2025-07-25T06:20:04.163681Z
        tenantId:
          type: integer
          description: The unique identifier for the tenant that is associated with
            the work item model.
          example: 1
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/WorkItemModelAttribute'
    WorkItemModelAttributeWithoutId:
      type: object
      properties:
        name:
          type: string
          description: name of the work item model
          example: Employee Salary
        type:
          type: string
          enum:
          - NUMBER
          - TEXT
          - DATE
    WorkItemModelAttribute:
      type: object
      properties:
        id:
          type: number
          description: unique identifier of the value in the workitem model template
        name:
          type: string
          description: name of the work item model
          example: Employee Salary
        type:
          type: string
          enum:
          - NUMBER
          - TEXT
          - DATE
    WorkItemModelList:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/PageResponse'
