swagger: "2.0"

info:
  title: API Task Execution API
  description: " To execute an API Task in public workspace, you need to go through a number of steps.
  
    - Create an API Task Allocation \n
    - Get access details for the allocation created. Access details include execute URL \n
    to run the Api Task as well as all the required headers. 
    - Use the url and the headers returned with Access details to execute the API Task. \n
    - example url: http://localhost:63342/knative-33.hotbot-0dd41155-2bc8-df13-700d-b8a1a0b02d75.svc.cluster.local/execute \n
    - example headers: \n
      \t 1. X-Authorization: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c \n
      \t 2. API-Task-Name: Reverse String \n
    - Returns API Task result. \n
    
  
    All API calls must contain either an authentication token from Authentication API (generates JSON Web token) or a bearer token from OAuth services. You cannot use both together in an API.
      
    
    **Header:** `X-Authorization: <<authentication token>> or Authorization: Bearer <<bearer token>>`"
  version: 1.0.0

basePath: "/"

schemes:
  - "http"
  - "https"

produces:
  - application/json

securityDefinitions:
  AccessToken:
    type: apiKey
    description: >
      **X-Authorization: _token_**
    name: X-Authorization
    in: header

security:
  - AccessToken: []

paths:
  /orchestrator/v1/hotbot/config/create:
    put:
      summary: "Create API Task Allocation"
      description:
        "Create an API Task Allocation."
      consumes:
        - application/json
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/HotBotCreateRequest"
      tags:
        - API Task
      responses:
        "200":
          description: "Newly created API Task Allocation."
          schema:
            $ref: "#/definitions/HotBotCreateResponse"
        "400":
          description: Bad Request.
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: Authentication required.
          schema:
            $ref: "#/definitions/Error"
        "404":
          description: Not Found.
          schema:
            $ref: "#/definitions/ErrorMessage"
        "500":
          description: Server error.
          schema:
            $ref: "#/definitions/Error"

  /orchestrator/v1/hotbot/config:
    post:
      summary: "API Task Access Details"
      description:
        "Get all the existing API Task allocations."
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/FilterRequest'
      tags:
        - API Task
      responses:
        "200":
          description: "Paginated list of all API Task allocations for the tenant."
          schema:
            $ref: "#/definitions/HotBotConfigList"
        "400":
          description: Bad Request.
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: Authentication required.
          schema:
            $ref: "#/definitions/Error"
        "404":
          description: Not Found.
          schema:
            $ref: "#/definitions/ErrorMessage"
        "500":
          description: Server error.
          schema:
            $ref: "#/definitions/Error"

  /orchestrator/v1/hotbot/config/accessdetails:
    post:
      summary: "API Task Access Details"
      description: 
       "A user with access to API Task Access Details can get API Task Execution url and execute the task"
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/HotBotAccessDetailsRequest"
      tags:
        - API Task
      consumes:
        - "application/json"
      responses:
        "200":
          description: API Task Access Details url with headers is returned, that can be used to execute the task.
          schema:
            $ref: "#/definitions/HotBotAccessDetailsResponse"
        "400":
          description: Bad Request.
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: Authentication required.
          schema:
            $ref: "#/definitions/Error"
        "404":
          description: Not Found.
          schema:
            $ref: "#/definitions/ErrorMessage"
        "500":
          description: Server error.
          schema:
            $ref: "#/definitions/Error"

  /knative-33.hotbot-0dd41155-2bc8-df13-700d-b8a1a0b02d75.svc.cluster.local/execute:
    post:
      summary: "Execute API Task"
      description:
        "
        - A user with access to API Task Access Details can get API Task Execution url as well as the necessary headers to execute the api task. \n
        - All headers specified in the Access Details response must be sent as headers in the execute request. \n
        - The headers may contain, for eg. X-Authorization, API-Task-Name, etc. which will be validated when execute endpoint is called. \n
        - Above url is just an example of execute endpoint,
         actual url will be dynamic and should be obtained from the response to accessDetails request."
      
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/HotBotInput"
      tags:
        - API Task

      responses:
        "200":
          description: API Task execution result returned.
          schema:
            $ref: "#/definitions/HotBotOutput"

        "400":
          description: Bad Request.
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: Authentication required.
          schema:
            $ref: "#/definitions/Error"
        "404":
          description: This means the hotbot service is not configured and will be accompanied by a CORS error. Was the allocation created correctly? Check for “API Task Warmup completed” event in audit log.
          schema:
            $ref: "#/definitions/ErrorMessage"
        "500":
          description: Server error.
          schema:
            $ref: "#/definitions/Error"

definitions:

  HotBotConfigList:
    type: "object"
    properties:
      page:
        type: "object"
        properties:
          offset:
            type: integer
            description: Page starting index
          total:
            type: integer
            description: Total number of items
            example: 1
          totalFilter:
            type: integer
            description: Total number of items matching filter
            example: 1
          list:
            type: array
            items:
              $ref: '#/definitions/HotBotConfigResponse'
            description: list of hotbot configs

  HotBotConfigResponse:
    type: object
    properties:
      fileId:
        type: string
        description: Bot file Id
        example: 5
      filePath:
        type: string
        description: Repository path of the API Task
        example: Automation Anywhere\\Bots\\Reverse String Task
      fileName:
        type: string
        description: Name of the bot
      runAsUser:
        type: integer
        format: int64
        description: User Id selected to run this API Task allocation
        example: 3
      concurrencyLimit:
        type: integer
        description: Concurrency limit
        example: 2

  HotBotCreateRequest:
    type: object
    required:
      - fileId
    properties:
      fileId:
        type: string
        description: Bot file Id
        example: 5
      runAsUserOrNone:
        type: integer
        format: int64
        description: Run As UserId
        example: 3
      concurrencyLimit:
        type: integer
        description: Concurrency Limit
        example: 2

  HotBotCreateResponse:
    type: object
    required:
      - fileId
    properties:
      fileId:
        type: string
        description: Bot file Id
        example: 5
      runAsUserOrNone:
        type: integer
        format: int64
        description: Run As UserId
        example: 3
      concurrencyLimit:
        type: integer
        description: Concurrency Limit
        example: 2

  HotBotAccessDetailsRequest:
    type: object
    required:
      - botRepositoryPath
    properties:
      botRepositoryPath:
        type: array
        description: Repository path of the API Task.
        example: ["Automation Anywhere\\Bots\\My-API-Task"]
        items:
          type: string

  HotBotAccessDetailsResponse:
    type: object
    required:
      - accessDetails
      - errors
    properties:
      accessDetails:
        $ref: '#/definitions/HotBotAccessDetails'
      errors:
        $ref: '#/definitions/Error'
    description: Access Details or errors map with key = repo path

  HotBotAccessDetails:
    type: object
    properties:
      url:
        type: string
        description: API task execution url
        example: http://localhost:63342/knative-33.hotbot-0dd41155-2bc8-df13-700d-b8a1a0b02d75.svc.cluster.local/execute
      headers:
        type: object
        $ref: '#/definitions/Headers'

  Headers:
    type: object
    additionalProperties:
      type: string
    example:
      X-Authorization: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
      API-Task-Name: Reverse String
    description: Headers to be used in execute endpoint

  HotBotInput:
    type: object
    properties:
      BotInput:
        $ref: "#/definitions/BotInput"

  HotBotOutput:
    type: object
    properties:
      HotBotResult:
        $ref: "#/definitions/HotBotResult"

  BotInput:
    type: object
    properties:
      Input:
        $ref: "#/definitions/Input"

  Input:
    type: object
    properties:
      type:
        $ref: "#/definitions/AttributeType"
    example:
      type: STRING
      string: 12345

  BotOutput:
    type: object
    properties:
      Output:
        $ref: "#/definitions/Value"

  Dictionary:
    type: object
    properties:
      key:
        type: string
      value:
        $ref: "#/definitions/Value"

  Value:
    type: object
    properties:
      type:
        $ref: "#/definitions/AttributeType"
      expression:
        type: string
        example: ""
      string:
        type: string
        example: 54321
      number:
        type: string
        example: ""
      boolean:
        type: string
        example: ""
      repository:
        type: string
        example: ""
      variableName:
        type: string
        example: ""
      packageId:
        type: string
        example: ""
      packageName:
        type: string
        example: ""
      iteratorId:
        type: string
        example: ""
      iteratorName:
        type: string
        example: ""
      conditionalId:
        type: string
        example: ""
      conditionalName:
        type: string
        example: ""
      list:
        type: array
        items:
          type: string
          example:
      dictionary:
        type: array
        items:
          $ref: "#/definitions/Dictionary"
          example:
      exceptionName:
        type: string
        example: ""
      properties:
        type: array
        items:
          $ref: "#/definitions/Property"
          example:
      triggerName:
        type: string
        example: ""
      formElementId:
        type: string
        example: ""
      formElementType:
        type: string
        example: ""
      formInstanceId:
        type: string
        example: ""
      thumbnailMetadataPath:
        type: string
        example: ""
      screenshotMetadataPath:
        type: string
        example: ""
      queueName:
        type: string
        example: ""
      securelyRecorded:
        type: boolean
        format: boolean
        example: false
      sessionTarget:
        type: string
        example: ""
      taskbotSelf:
        type: boolean
        format: boolean
        example: false
      variableMapFilter:
        type: array
        items:
          type: string
          example:
      variableMapNames:
        type: array
        items:
          type: string
          example:

  Property:
    type: object
    properties:
      name:
        $ref: "#/definitions/Value"
      value:
        $ref: "#/definitions/Value"
      enabled:
        type: boolean
        format: boolean

  HotBotResult:
    type: object
    properties:
      BotOutput:
        $ref: '#/definitions/BotOutput'

  AttributeType:
    type: string
    enum:
      - STRING
      - NUMBER
      - BOOLEAN
      - FILE
      - ITERATOR
      - LIST
      - DICTIONARY
      - TABLE
      - VARIABLE
      - CONDITIONAL
      - WINDOW
      - TASKBOT
      - DATETIME
      - UIOBJECT
      - RECORD
      - EXCEPTION
      - CREDENTIAL
      - COORDINATE
      - IMAGE
      - REGION
      - PROPERTIES
      - TRIGGER
      - CONDITIONALGROUP
      - FORM
      - FORMELEMENT
      - HOTKEY
      - WORKITEM
    default: STRING
    example: STRING

  FilterRequest:
    type: object
    description: 'Filter request, which includes filtering, sorting, and pagination rules'
    properties:
      page:
        $ref: '#/definitions/PageRequest'

  PageRequest:
    type: object
    description: Pagingation rules, allows you to filter based on desired page
    properties:
      offset:
        type: integer
        description: Page starting index
      length:
        type: integer
        description: Page length
        example: 100

  ErrorMessage:
    type: object
    properties:
      message:
        type: string
        description: Error Message

  Error:
    type: object
    properties:
      code:
        type: string
        description: Error code
      message:
        type: string
        description: Error Message
    