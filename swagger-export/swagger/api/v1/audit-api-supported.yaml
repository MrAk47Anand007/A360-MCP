          - EXPORT_BOT_FILES_API
          - FIRST_ADMIN_SETTINGS
          - FORCE_UNLOCK_BOT
          - FORCE_UNLOCK_FILE
          - IMPORT_BOT_FILES_API
          - INSTALL_LICENSE
          - LOGIN
          - LOGOUT
          - MIGRATION_FINISH
          - MIGRATION_START
          - AUDIT_MIGRATION_FINISH
          - AUDIT_MIGRATION_START
          - MOVE_TO_HISTORY
          - MULTI_LOGIN
          - POOL_CREATE_FAILED
