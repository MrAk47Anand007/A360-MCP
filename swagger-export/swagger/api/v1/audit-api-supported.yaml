      environmentName:
        type: string
        description: Name of the environment
        maxLength: 100
        example: xxxx
      hostName:
        type: string
        description: Name of the host
        maxLength: 100
        example: docs-kernel-622f7d9b78-wtjl9
      userName:
        type: string
        description: UserName of the user who performed the activity
        maxLength: 100
        example: cr_user
      status:
        type: string
        description: Status of the activity
        example: Successful
        enum:
          - Unknown
          - Successful
          - Unsuccessful
      source:
        type: string
        description: Source of the activity
        example: Control Room
        maxLength: 25
      objectName:
        type: string
        example: xxxyy
        description: Object Name
        maxLength: 256
      createdOn:
        $ref: '#/definitions/Iso8601DateFormat'
      requestId:
        type: string
        description: ID of the request
        example: 131f189732c8ba52
        maxLength : 36
      createdBy:
        type: string
        description: ID of the user
        example: 28
    required:
      - eventDescription
      - activityType
      - userName
      - status
  Iso8601DateFormat:
    type: string
    example: "2022-11-01T09:52:16Z"
    pattern: >-
      ^([0-9][0-9][0-9][0-9])-?(0[1-9]|1[0-2])-?(0[1-9]|1[0-9]|2[0-9]|30|31)(T(0[0-9]|1[0-9]|2[0-3]):?([0-5][0-9]):?([0-5][0-9])(\.[0-9]+)?([Z]|[\+-](0[0-9]|1[0-2]):?([0-5][0-9]))?)?$
  Error:
    type: object
    properties:
      code:
        type: integer
        description: Error code
      message:
        type: string
        description: Message describing error
      details:
        type: string
        description: Details of an error
responses:
