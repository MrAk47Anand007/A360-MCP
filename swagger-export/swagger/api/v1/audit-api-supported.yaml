swagger: '2.0'
info:
  version: 1.3.1.1
  title: Audit API
  description: Use the Audit API to retrive audit log data from your Control Room. <br>

    <b>Prerequisites</b> <br>
    <ul><li>Users with the **AAE_Admin** role or users with the **View everyone audit log actions** permission can view audit logs for the Control Room.</li></ul>
    All API calls must contain either an authentication token from Authentication API (generates JSON Web token) or a bearer token from OAuth services. You cannot use both together in an API.<br>
    **Header file example:** `-H X-Authorization <authentication token>` or `Authorization:Bearer <bearer token>`

schemes:
  - http
  - https
basePath: /v1/audit
produces:
  - application/json
securityDefinitions:
  AccessToken:
    type: apiKey
    description: >
      **X-Authorization: _token_**
    name: X-Authorization
    in: header
security:
  - AccessToken: []
paths:
  /messages/list:
    post:
      summary: Fetch Audit data for a given input
      description: Request audit data for a given input combination of date filter, sorting mechanism, and pagination.
      
        
        **Note:** The Fetch Audit data API retrieves a maximum of 400 rows per response. Increment the offset value to fetch the next set of results.
      consumes:
        - application/json
      parameters:
        - name: body
          in: body
          description: Filter, Sort and Pagination combination for Audit data output
          schema:
            $ref: '#/definitions/FilterRequest'
          required: true
      tags:
        - audit
      responses:
        '200':
          description: OK
          schema:
            allOf:
              - $ref: '#/definitions/AuditResults'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Authentication required
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Unauthorized access
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Not found
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Conflict
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Internal Server error
          schema:
            $ref: '#/definitions/Error'
definitions:
  FilterRequest:
    type: object
    description: Filter request, which includes filtering, sorting and pagination rules
    properties:
      sort:
        type: array
        description: Sort directions
        items:
          $ref: '#/definitions/Sort'
      filter:
        $ref: '#/definitions/Filter'
      page:
        $ref: '#/definitions/PageRequest'
  Sort:
    type: object
    description: Sorting rules
    properties:
      field:
        type: string
        description: Field name to sort by
        example: createdOn
      direction:
        type: string
        description: Sorting direction
        enum:
          - asc
          - desc
        example: desc
  Filter:
    type: object
    description: Filter rules
    properties:
      operator:
        type: string
        description: Operator
        enum:
          - and
          - lt
          - le
          - eq
          - ne
          - ge
          - gt
          - substring
          - NONE
          - or
          - not
      operands:
        type: array
        items: 
          $ref: '#/definitions/Ops'
        example:
          - operator: gt
            field: createdOn
            value: "2022-11-02T00:00:00.001Z"
          - operator: substring
            field: activityType
            value: LOGIN
  Ops:
     type: object
     description: Operands rules
     properties:
      operator:
        type: string
        description: Operator
        enum:
          - gt
          - lt
          - le
          - eq
          - ne
          - ge
          - and
          - substring
          - NONE
          - or
          - not
  PageRequest:
    type: object
    description: Pagingation rules
    properties:
      offset:
        type: integer
        description: Page starting index
        example: 0
      length:
        type: integer
        description: Page length
        example: 1000
  AuditResults:
    type: object
    properties:
      page:
        type: object
        description: Pagingation response
        properties:
          offset:
            type: integer
            description: Page starting index
            minimum: 0
            maximum: 2147483647
            example: 0
          total:
            type: integer
            description: Total number of items
            example: 48852894
          totalFilter:
            type: integer
            description: Total number of items matching filter
            minimum: 1
            maximum: 2147483647
            example: 1
        required:
          - offset
          - total
          - totalFilter
      list:
        type: array
        description: List showing a collection of Audit activities
        items:
          $ref: '#/definitions/AuditMessage'
  AuditMessage:
    type: object
    properties:
      id:
        type: string
        description: Id of the Audit activity
        example: ZXcjOIQBL9lTQvkn-h3v
      eventDescription:
        type: string
        description: Description of the Event
        maxLength: 500
      activityType:
        type: string
        description: The type of activity performed
        example: LOGIN
        enum:
          - ACTIVATE_AUTOMATION
          - ADD_CREDENTIAL
          - ADD_LOCKER
          - ADD_MANUAL_DEPENDENCY
          - ADD_ROLE
          - ALLOCATE_LICENSE
          - AUDIT_ERROR
          - AUDIT_UNSET_ACTIVITY_TYPE
          - AUTOMATION_MISFIRED
          - BI_ADD_USER_DASHBOARD
          - BI_COPY_DASHBOARD
          - BI_DELETE_DASHBOARD
          - BI_DELETE_USER_DASHBOARD
          - BI_END_TASK
          - BI_GET_TASK_DATA
          - BI_GET_USER_DASHBOARDS
          - BI_OPERATIONS
          - BI_REGISTER_DASHBOARD
          - BI_RUN_DATA
          - BI_SAVE_DASHBOARD
          - BI_SEARCH_DASHBOARD
          - BI_START_TASK
          - BI_UPDATE_DASHBOARD
