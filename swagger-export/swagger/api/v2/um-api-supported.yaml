components:
  schemas:
    CreateRoleV2Response:
      required:
      - name
      type: object
      properties:
        id:
          type: string
          description: Unique identifier representing a specific role
          example: 264.0
        name:
          type: string
          description: Name of the role
          example: Trigger Manager
        description:
          type: string
          description: Description of the role
          example: View and Manage the triggers
        createdBy:
          type: string
          description: Id of the user who created the role.
          example: 10.0
        createdOn:
          type: string
          description: The creation timestamp of the role.
          example: 2025-03-21T16:16:57.403579Z
        updatedBy:
          type: string
          description: Id of the user who last updated the role.
          example: 10.0
        updatedOn:
          type: string
          description: Timestamp when the role was last updated.
          example: 2025-03-21T16:16:57.403584Z
        permissions:
          type: array
          description: Collection of unique permissions that have been assigned to
            the role.
          items:
            $ref: '#/components/schemas/PermissionV2Response'
        userIds:
          type: array
          description: An array of unique users that have been assigned to the role.
          items:
            type: string
            example: 21
    UpdateRoleV2Response:
      required:
      - name
      type: object
      properties:
        id:
          type: number
          description: Unique identifier representing a specific role
          example: 264.0
        name:
          type: string
          description: Name of the role
          example: Trigger Manager
        description:
          type: string
          description: Description of the role
          example: View and Manage the triggers
        createdBy:
          type: string
          description: Id of the user who created the role.
          example: 10.0
        createdOn:
          type: string
          description: The creation timestamp of the role.
          example: 2025-03-21T12:52:41.107697Z
        updatedBy:
          type: string
          description: Id of the user who last updated the role.
          example: 10.0
        updatedOn:
          type: string
          description: Timestamp when the role was last updated.
          example: 2025-03-21T12:52:41.107697Z
        permissions:
          type: array
          description: Collection of unique permissions that have been assigned to
            the role.
          items:
            $ref: '#/components/schemas/PermissionV2Response'
        userIds:
          type: array
          description: An array of unique users that have been assigned to the role.
          items:
            type: string
            example: 21
    GetRoleByIdV2Response:
      required:
      - name
      type: object
      properties:
        id:
          type: string
          description: Unique identifier representing a specific role
          example: 264.0
        name:
          type: string
          description: Name of the role
          example: Finance role
        description:
          type: string
          description: Description of the role
          example: Finance role to manage the org finances
        createdBy:
          type: string
          description: Id of the user who created the role.
          example: 10.0
        createdOn:
          type: string
          description: The creation timestamp of the role.
          example: 2025-03-21T12:52:41.107697Z
        updatedBy:
          type: string
          description: Id of the user who last updated the role.
          example: 10.0
        updatedOn:
          type: string
          description: Timestamp when the role was last updated.
          example: 2025-03-21T12:52:41.107697Z
        permissions:
          type: array
          description: Collection of unique permissions that have been assigned to
            the role.
          items:
            $ref: '#/components/schemas/PermissionV2Response'
        userIds:
          type: array
          description: An array of unique users that have been assigned to the role.
          items:
            type: string
            example: 21
    CreateRoleV2Request:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: Name of the role
          example: Trigger Manager
        description:
          type: string
          description: Description of the role
          example: View and Manage the triggers
        permissions:
          type: array
          description: An array of permissions that will be granted for the role.
            Each permission requires the mandatory parameters.
          items:
            $ref: '#/components/schemas/PermissionV2'
        userIds:
          type: array
          description: An array/collection of user IDs who will be granted access
            with the role.
          items:
            type: string
            example: 21
    UpdateRoleV2Request:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: Name of the role
          example: Trigger Manager
        description:
          type: string
          description: Description of the role
          example: View and Manage the triggers
        permissions:
          type: array
          description: An array of permissions that will be granted for the role.
            Each permission requires the mandatory parameters.
          items:
            $ref: '#/components/schemas/PermissionV2'
        userIds:
          type: array
          description: An array/collection of user IDs who will be granted access
            with the role.
          items:
            type: string
            example: 21
    PermissionV2:
      type: object
      properties:
        action:
          type: string
          description: The action the permission enables.
          example: managecredentials
        resourceType:
          type: string
          description: The resource group to which the action belongs. Typically a
            user is given the role permission in conjunction with user management
            permission.
          example: credentials
    PermissionV2Response:
        type: object
        properties:
         id:
          type: string
          description: The numeric value that uniquely identifies the permission.
          example: 1345.0
         action:
          type: string
          description: The action the permission enables.
          example: managecredentials
         resourceId:
          type: string
          description: The resource id to which the action belongs.
          example: "" 
         resourceType:
          type: string
          description: The resource group to which the action belongs. Typically a
            user is given the role permission in conjunction with user management
            permission.
          example: credentials
    LicenseFeature:
      type: string
      description: License feature
      example:
          - ANALYTICSCLIENT
          - DEVELOPMENT
      enum:
      - DEVELOPMENT
      - RUNTIME
      - ANALYTICSCLIENT
      - ATTENDEDRUNTIME
      - DISCOVERYBOTANALYZER
      - DISCOVERYBOTRECORDER
      - AARIUSER
      - CITIZENDEVELOPER
      - CLOUDBOTRUNNER
    UserV2:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier representing a specific permission
          example: 110.0
        username:
          type: string
          description: User login
          example: bot_creator
        firstName:
          type: string
          example: Mike
        lastName:
          type: string
          example: Bots
        description:
          type: string
          example: User to manage bots
        disabled:
          type: boolean
          description: user enable/disable flag
        clientRegistered:
          type: boolean
          description: client/device is registered flag
        createdBy:
          type: string
          description: Id of the user who created the role
          example: 27.0
        createdOn:
          type: string
          description: Date when the role was created
          example: 2025-03-21T12:52:41.107693Z
        updatedBy:
          type: string
          description: Id of the user who made a latest update to the role
          example: 29.0
        updatedOn:
          type: string
          description: Date when it was the latest update made to the role
          example: 2025-03-21T12:52:41.107697Z
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleBasicV2'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionV2'
        licenseFeatures:
          type: array
          items:
            $ref: '#/components/schemas/LicenseFeature'
        version:
           type: number
           description: Version of the user instance
           example: 1.0
        principalId:
          type: string
          example: 266
        domain:
          type: string
          description: ActiveDirectory(LDAP) domain
          example: "null"
        email:
          type: string
          example: xyz@automationanywhere.com
        emailVerified:
          type: boolean
        passwordSet:
          type: boolean
          description: this flag indicate that user set his password
        questionsSet:
          type: boolean
          description: this flag indicate that user set questions and answer
        enableAutoLogin:
          type: boolean
    FilterRequest:
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/Filter'
        sort:
          type: array
          description: Sort directions
          items:
            $ref: '#/components/schemas/Sort'
        page:
          $ref: '#/components/schemas/PageRequest'
      description: "Filter request, which includes filtering, sorting, and pagination\
        \ rules."
    Sort:
      type: object
      properties:
        field:
          type: string
          description: Field name to sort by
          example: name
        direction:
          type: string
          description: Sorting direction
          enum:
          - asc
          - desc
      description: "By default, search results are sorted in descending order with\
        \ respect to their IDs. An alternative sorting is specified by using the sort\
        \ query parameter."
    PageRequest:
      type: object
      properties:
        offset:
          type: integer
          description: Page starting index
        length:
          type: integer
          description: Total number of items to display
          example: 100
      description: "Pagination rules, allows you to filter based on desired page"
    PageResponse:
        type: object
        properties:
          offset:
            type: integer
            description: Page starting index
          total:
            type: integer
            description: Total number of items to display
            example: 100
          totalFilter:
            type: integer
            description: Total number of items matching filter
            example: 100
        description: "Pagination rules, allows you to filter based on desired page"
    Filter:
      type: object
      properties:
        operator:
          type: string
          description: Operator
          example: and
          enum:
          - NONE
          - lt
          - le
          - eq
          - ne
          - ge
          - gt
          - substring
          - and
          - or
          - not
        operands:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
        field:
          type: string
          description: "Filtering field can be either name, lastModified, path, or\
            \ folder."
          example: name
        value:
          type: string
          description: Filter value
          example: device
      description: "Filters the result based on operator, field, or value."
    UserFilterResponseV2:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/PageResponse'
        list:
          type: array
          items:
            $ref: '#/components/schemas/UserV2'
      description: Filtered user list
    RoleFilterResponse:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/PageResponse'
        list:
          type: array
          items:
            title: Role
            type: object
            properties:
              id:
                type: string
                description: Unique identifier representing a specific role
                example: 644
              name:
                type: string
                description: Name of role
                example: Trigger Manager
              description:
                type: string
                description: Description of role
                example: View and Manage the triggers
              countPrincipals:
                type: number
                description: Count of Principals (users) who are granted with this
                  role
                example: 1.0
              version:
                type: number
                description: Version of the role instance
                example: 0.0
              createdBy:
                type: string
                description: Id of the user who created the role
                example: 27.0
              createdOn:
                type: string
                description: Date when the role was created
                example: 2025-03-21T16:16:57.403Z
              updatedBy:
                type: string
                description: Id of the user who made a latest update to the role
                example: 29.0
              updatedOn:
                type: string
                description: Date when it was the latest update made to the role
                example: 2025-03-21T16:16:57.403Z
              systemRole:
                type: boolean
                description: Flag to indicate if this role is system role or not
                example: false
              enabled:
                type: boolean
                description: Flag to indicate if this role is enabled or not
                example: true
      description: Filtered role list
    Error:
      type: object
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Message describing error
        details:
          type: string
          description: More details of the error message
    FindUserByIdResponse:
      type: object
      properties:
        domain:
          type: string
          description: ActiveDirectory(LDAP) domain
          example: AD-DOMAIN
        email:
