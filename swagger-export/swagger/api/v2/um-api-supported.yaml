              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - User
      summary: Update user details
      description: Use the Update user details API to update an existing user information
        in the Control Room. You must specify the user ID.
      parameters:
      - name: uid
        in: path
        description: Unique object id
        required: true
        schema:
          type: integer
