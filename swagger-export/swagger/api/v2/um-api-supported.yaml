openapi: 3.0.1
info:
  title: User Management API
  description: |-
    Use the User Management APIs to view and delete roles and users in your Control Room. You need the following permissions to manage users and roles. <ul><li><b>View users</b><br> Users with this permission can view users to which they have access. <li><b>Create users</b><br> Create new users in the Control Room. <li><b>Edit users</b><br> Edit all users in the Control Room, including users created by other administrators. <li><b>Delete users</b><br> Delete any user in the Control Room. <li><b>View roles</b><br> Users with this permission can view roles to which they have access. <li><b>Manage roles</b><br> Users can create, edit and delete roles to which they have access.
    For more information about roles and permissions, see [Roles and permissions](https://docs.automationanywhere.com/bundle/enterprise-v2019/page/enterprise-cloud/topics/control-room/control-room-api/cloud-features-api-id-to-ui-map.html).

    All API calls must contain either an authentication token from Authentication API (generates JSON Web token) or a bearer token from OAuth services. You cannot use both together in an API.

    **Header:** `X-Authorization: <<authentication token>> or Authorization: Bearer <<bearer token>>`
  version: 2.0.0
servers:
- url: /v2/usermanagement
security:
- AccessToken: []
paths:
  /roles/list:
    post:
      tags:
      - Role
      summary: List roles
      description: "Use the List Roles API to retrieve a list of roles in the Control\
        \ Room. This endpoint supports pagination, sorting, and filtering. For more\
        \ information, see [Filtering, pagination, and sorting](https://docs.automationanywhere.com/bundle/enterprise-v2019/page/enterprise-cloud/topics/control-room/control-room-api/cloud-api-filter-request.html)."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterRequest'
        required: true
      responses:
        "200":
          description: Found roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleFilterResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: body
  /roles:
    post:
      tags:
      - Role
      summary: Create role
      description: Use Create role API to create a new role with permissions in the
        Control Room.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleV2Request'
        required: true
      responses:
        "201":
          description: Return created role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRoleV2Response'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: body
  /roles/{id}:
    get:
      tags:
      - Role
      summary: Retrieve role by ID
      description: Use the Get role by ID API to retrieve a specific role by specifying
        the role ID.
      parameters:
      - name: id
        in: path
        description: Unique object id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRoleByIdV2Response'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - Role
      summary: Update role
      description: Use Update role API to update an existing role with permissions
        in the Control Room.
      parameters:
      - name: id
        in: path
        description: Unique object id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleV2Request'
        required: true
      responses:
        "201":
          description: Return created role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateRoleV2Response'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: body
    delete:
      tags:
      - Role
      summary: Delete role
      description: Use the Delete role API to delete an existing role in the Control
        Room. You must specify the role ID.
      parameters:
      - name: id
        in: path
        description: Unique object id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Successful delete.
          content: {}
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/list:
    post:
      tags:
      - User
      summary: List users
      description: Use the List users API to search and list users in the Control
        Room.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterRequest'
        required: true
      responses:
        "200":
          description: Found users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFilterResponseV2'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: body
  /users:
    post:
      tags:
      - User
      summary: Create user
      description: Use the Create user API to create a new user in the Control Room.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Internal Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: body
  /users/{uid}:
    get:
      tags:
      - User
      summary: Get user details
      description: Use the Get user details API to retrieve a specific user details
        by specifying the user ID.
      parameters:
      - name: uid
        in: path
        description: Unique object id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: "null"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindUserByIdResponse'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Authentication required
          content:
