swagger: '2.0'

info:
  title: Automation Scheduler API
  description: "Use the Automation Scheduler APIs to create, update, delete, and return details on scheduled automations.
      <br>
      
      <b>Prerequisites</b><br>
      Ensure that you are allocated the following resources:
      <li><b>Schedule my bots to run</b> feature permission.</li>
      <li><b>Run and schedule</b> permissions for the folders that contain the automations.</li>
      
      **Note:** If the user associated with the Bot Runner license has a default device assigned to their account, the bot deploys on that device. If no default device is assigned, or you want to select a different device, then you must specify a device pool.

      
      All API calls must contain either an authentication token from Authentication API (generates JSON Web token) or a bearer token from OAuth services. You cannot use both together in an API.<br>
    
    **Header:** `X-Authorization: <<authentication token>> or Authorization: Bearer <<bearer token>>`"
  version: 1.0.0

basePath: /v2

schemes:
  - http
  - https

produces:
  - application/json

securityDefinitions:
  AccessToken:
    type: apiKey
    description: |
      **X-Authorization: _token_**
    name: X-Authorization
    in: header

security:
  - AccessToken: []

paths:

  /schedule/automations:
    post:
      summary: Create an automation schedule
      description: >-
        use this API to schedule automations like Task bots, API task, Processes either one time or on a recurring basis.
        To Schedule process Ensure that you are allocated the following resources:
                  <li>Run and schedule permissions for the folders that contain the Process
                  <li>Access to Process Teams/Roles
        To schedule task bots ensure that you are allocated the following resources:
                  <li>View and Run my bots feature permission
                  <li>Run and schedule permissions for the folders that contain the bots
                  <li>Access to Bot Runner licensed users
                  <li>Access to either a default device or a device pool
        To schedule api task ensure that you are allocated the following resources:
                  <li>View and Run my bots feature permission
                  <li>Run and schedule permissions for the folders that contain the task
                  <li>View access to All Bot Runner users

        <p> <b>Note:</b> Automation schedule can be set up with or without any input fields. If you specify inputs, make sure that the automations to successfully receive these mapped in values, the variable for that automation must be marked as input. Additionally, the name of the variable in the automation has to match the value that is being mapped in the request body.</p>
        <p>Example value specified below is for Dictionary Input. You can view the other Bot input types in the <b>Models</b> section at the end of the swagger.

      consumes:
        - application/json
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ScheduleAutomationRequest'
      tags:
        - Automations
      responses:
        '200':
          description: Valid Request.
          schema:
            $ref: '#/definitions/ScheduleAutomationResponse'
        '400':
          description: Bad Request.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Authentication required.
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Not Found.
          schema:
            $ref: '#/definitions/ErrorMessage'
        '500':
          description: Server error.
          schema:
            $ref: '#/definitions/Error'

  /schedule/automations/{id}:
    put:
      summary: Update an automation schedule
      description: "Use this API to update the schedule of an automation. You must specify the schedule automation ID."
      consumes:
        - application/json
      parameters:
        - name: "id"
          in: "path"
          description: "ID of the schedule automation"
          required: true
          type: integer
          format: int64
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ScheduleAutomationRequest'
      tags:
        - Automations
      responses:
        '200':
          description: Valid Request.
          schema:
            $ref: '#/definitions/ScheduleAutomationResponse'
        '400':
          description: Bad Request.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Authentication required.
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Not Found.
          schema:
            $ref: '#/definitions/ErrorMessage'
        '500':
          description: Server error.
          schema:
            $ref: '#/definitions/Error'

    delete:
      summary: Delete schedule automation
      description: Use this API to delete an existing schedule automation. You must specify the schedule automation ID.
      parameters:
        - name: "id"
          in: "path"
          description: "ID of the automation"
          required: true
          type: integer
          format: int64
      tags:
        - Automations
      responses:
        '204':
          description: Return 'nocontent'
        '404':
          description: Not Found.
          schema:
            $ref: '#/definitions/ErrorMessage'
        '500':
          description: Server error.
          schema:
            $ref: '#/definitions/Error'

  /schedule/automations/list:
    post:
      summary: "List schedule automations available to the user"
      description: "Use this API to retrieve a list of automations available to the user. You must be assigned a role that includes the View and manage all scheduled activity from my Folders permission.
           
           
           You can send an API request with or without filter parameters. An API request without any filter parameters specified, retrieves details of all the automations in the Control Room. You can use the filter parameters to retrieve specific automation details. For more information, see [Filtering, pagination, and sorting](https://docs.automationanywhere.com/bundle/enterprise-v2019/page/enterprise-cloud/topics/control-room/control-room-api/cloud-api-filter-request.html)."
      tags:
        - Automations
      consumes:
        - "application/json"
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/FilterRequest'
      responses:
        '200':
          description: >-
            Returns list of schedule automations available to the user
          schema:
            $ref: '#/definitions/ScheduleFilterResponse'
        '400':
          description: Bad Request.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Authentication required.
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Not Found.
          schema:
            $ref: '#/definitions/ErrorMessage'
        '500':
          description: Server error.
          schema:
            $ref: '#/definitions/Error'
  /schedule/automations/changeOwner:
    put:
      summary: change owner of an automation schedule
      description: "Use this API to change the owner of scheduled automation."
      consumes:
        - application/json
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ScheduleAutomationChangeOwnerRequest'
      tags:
        - Automations
      responses:
        '200':
          description: Valid Request.
        '400':
          description: Bad Request.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Authentication required.
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Not Found.
          schema:
            $ref: '#/definitions/ErrorMessage'
        '500':
          description: Server error.
          schema:
            $ref: '#/definitions/Error'

  /schedule/automations/activate/{id}:
    put:
      summary: Activate automation schedule
      description: "Use this API to activate an automation schedule. You must specify the schedule automation ID."
      consumes:
        - application/json
      parameters:
        - name: "id"
          in: "path"
          description: "ID of the automation"
          required: true
          type: integer
          format: int64
      tags:
        - Automations
      responses:
        '200':
          description: Valid Request.
        '400':
          description: Bad Request.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Authentication required.
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Not Found.
          schema:
            $ref: '#/definitions/ErrorMessage'
        '500':
          description: Server error.
          schema:
            $ref: '#/definitions/Error'

  /schedule/automations/deactivate/{id}:
    put:
      summary: Deactivate automation schedule
      description: "Use this API to deactivate an automation schedule. You must specify the schedule automation ID."
      consumes:
        - application/json
      parameters:
        - name: "id"
          in: "path"
          description: "ID of the automation"
          required: true
          type: integer
          format: int64
      tags:
        - Automations
      responses:
        '200':
          description: Valid Request.
        '400':
          description: Bad Request.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Authentication required.
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Not Found.
          schema:
            $ref: '#/definitions/ErrorMessage'
        '500':
          description: Server error.
          schema:
            $ref: '#/definitions/Error'

  /schedule/automations/activate:
    put:
      summary: Activate automation schedules
      description: "Use this API to activate multiple scheduled automations."
      consumes:
        - application/json
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ScheduleAutomationActivateBatchRequest'
      tags:
        - Automations
      responses:
        '200':
          description: Valid Request.
        '400':
          description: Bad Request.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Authentication required.
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Not Found.
          schema:
            $ref: '#/definitions/ErrorMessage'
        '500':
          description: Server error.
          schema:
            $ref: '#/definitions/Error'

  /schedule/automations/deactivate:
    put:
      summary: Deactivate automation schedules
      description: "Use this API to deactivate multiple scheduled automations."
      consumes:
        - application/json
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ScheduleAutomationDeactivateBatchRequest'
      tags:
        - Automations
      responses:
        '200':
          description: Valid Request.
        '400':
          description: Bad Request.
          schema:
            $ref: '#/definitions/Error'
        '401':
          description: Authentication required.
          schema:
            $ref: '#/definitions/Error'
        '404':
          description: Not Found.
          schema:
            $ref: '#/definitions/ErrorMessage'
        '500':
          description: Server error.
          schema:
            $ref: '#/definitions/Error'

definitions:

  AttributeType:
    type: string
    enum:
      - STRING
      - NUMBER
      - BOOLEAN
      - FILE
      - ITERATOR
      - LIST
      - DICTIONARY
      - TABLE
      - VARIABLE
      - CONDITIONAL
      - WINDOW
      - TASKBOT
      - DATETIME
      - UIOBJECT
      - RECORD
      - EXCEPTION
      - CREDENTIAL
      - COORDINATE
      - IMAGE
      - REGION
      - PROPERTIES
      - TRIGGER
      - CONDITIONALGROUP
      - FORM
      - FORMELEMENT
      - HOTKEY
      - WORKITEM
      - REGEX
      - PATTERN
      - FILEREGEX
      - SESSION
    default: STRING

  AutomationStatus:
    type: string
    enum:
      - DRAFT
      - ACTIVE
      - PAUSED
      - INACTIVE
      - COMPLETED
      - DELETED
      - ACTIVE_WITH_ERROR
      - INACTIVE_WITH_ERROR
    default: DRAFT

  Coordinate:
    type: object
    properties:
      x:
        $ref: '#/definitions/Value'
      'y':
        $ref: '#/definitions/Value'
      capture:
        $ref: '#/definitions/PointImageCapture'

  CredentialObject:
    type: object
    properties:
      name:
        type: string
      lockerName:
        type: string
      attributeName:
        type: string

  DailyRecurrence:
    type: object
    description: Specify the daily interval to schedule the bot
    properties:
      interval:
        type: integer
        format: int32

  DayOfWeek:
    type: string
    enum:
      - SUN
      - MON
      - TUE
      - WED
      - THU
      - FRI
      - SAT
    default: SUN

  Filter:
    type: object
    properties:
      operator:
        $ref: '#/definitions/FilterOperator'
      operands:
        type: array
        items:
          $ref: '#/definitions/Filter'
        example:
          operator: substring
          field: status
          value: DRAFT
      field:
        type: string
        description: Filtering field can be either name, lastModified, path, or folder.
        example: name
      value:
        type: string
        description: Filter value
        example: "My bot_2.22.11.16.15.37.33.admin"

  FilterOperator:
    type: string
    enum:
      - NONE
      - lt
      - le
      - eq
      - ne
      - ge
      - gt
      - substring
      - and
      - or
      - not
    default: NONE

  FilterRequest:
    type: object
    description: 'Filter request, which includes filtering, sorting, and pagination rules'
    properties:
      filter:
        $ref: '#/definitions/Filter'
      sort:
        type: array
        items:
          $ref: '#/definitions/Sort'
      page:
        $ref: '#/definitions/PageRequest'

  HotKey:
    type: object
    properties:
      key:
        type: string
      modifierKeys:
        type: array
        items:
          $ref: '#/definitions/HotKeyModifierKey'

  HotKeyModifierKey:
    type: string
    enum:
      - CONTROL
      - SHIFT
      - ALT
      - WINDOWS
      - ALT_GRAPH
    default: CONTROL

  KeyValueItem:
    type: object
    properties:
      key:
        type: string
      value:
        $ref: '#/definitions/Value'

  MonthOfYear:
    type: string
    enum:
      - JAN
      - FEB
      - MAR
      - APR
      - MAY
      - JUN
      - JUL
      - AUG
      - SEP
      - OCT
      - NOV
      - DEC
    default: JAN

  MonthlyDateRecurrence:
    type: object
    properties:
      monthsOfYear:
        type: array
        items:
          $ref: '#/definitions/MonthOfYear'
      dateOfMonth:
        type: integer
        format: int32

  MonthlyWeekDayRecurrence:
    type: object
    properties:
      monthsOfYear:
        type: array
        items:
          $ref: '#/definitions/MonthOfYear'
      weekOfMonth:
        $ref: '#/definitions/WeekOfMonth'
      dayOfWeek:
        $ref: '#/definitions/DayOfWeek'

  NestedNumberValue:
    type: object
    properties:
      type:
        $ref: '#/definitions/AttributeType'
      number:
        type: string
      expression:
        type: string

  NestedStringValue:
    type: object
    properties:
      type:
        $ref: '#/definitions/AttributeType'
      string:
        type: string
      expression:
        type: string

  PageRequest:
    type: object
    description: Pagination rules, allows you to filter based on desired page
    properties:
      offset:
        type: integer
        format: int32
        description: Page starting index
      length:
        type: integer
        format: int32
        description: Page length
        example: 100
  PageResponse:
    type: object
    properties:
      offset:
        type: integer
        format: int32
      total:
        type: integer
        format: int32
      totalFilter:
        type: integer
        format: int32
  Point:
    type: object
    properties:
      x:
        type: integer
        format: int32
      'y':
        type: integer
        format: int32
  PointImageCapture:
    type: object
    properties:
      thumbnailMetadataPath:
        type: string
      screenshotMetadataPath:
        type: string
      screenshotPoint:
        $ref: '#/definitions/Point'
      screenshotX:
        type: integer
        format: int32
      screenshotY:
        type: integer
        format: int32
      screenshotWidth:
        type: integer
        format: int32
      screenshotHeight:
        type: integer
        format: int32
      securelyRecorded:
        type: boolean
        format: boolean
  Property:
    type: object
    properties:
      name:
        $ref: '#/definitions/Value'
      value:
        $ref: '#/definitions/Value'
      enabled:
        type: boolean
        format: boolean
  Record:
    type: object
    properties:
      schema:
        type: array
        items:
          $ref: '#/definitions/Schema'
      values:
        type: array
        items:
          $ref: '#/definitions/Value'
  Rectangle:
    type: object
    properties:
      x:
        type: integer
        format: int32
      'y':
        type: integer
        format: int32
      width:
        type: integer
        format: int32
      height:
        type: integer
        format: int32
  RectangleImageCapture:
    type: object
    properties:
      thumbnailMetadataPath:
        type: string
      screenshotMetadataPath:
        type: string
      screenshotRectangle:
        $ref: '#/definitions/Rectangle'
      thumbnailRectangle:
        $ref: '#/definitions/Rectangle'
      securelyRecorded:
        type: boolean
        format: boolean
  RegexFile:
    type: object
    properties:
      folder:
        $ref: '#/definitions/NestedStringValue'
      name:
        $ref: '#/definitions/RegexFileName'
  RegexFileName:
    type: object
    properties:
      type:
        $ref: '#/definitions/AttributeType'
      list:
        type: array
        items:
          $ref: '#/definitions/NestedStringValue'
      regexFlags:
        $ref: '#/definitions/RegexFlags'
  RegexFlags:
    type: object
    properties:
      multiLine:
        type: boolean
        format: boolean
      dotAll:
        type: boolean
        format: boolean
      caseInsensitive:
        type: boolean
        format: boolean
  Region:
    type: object
    properties:
      x:
        $ref: '#/definitions/Value'
      'y':
        $ref: '#/definitions/Value'
      width:
        $ref: '#/definitions/Value'
      height:
        $ref: '#/definitions/Value'
      capture:
        $ref: '#/definitions/RectangleImageCapture'
  RepeatOccurrence:
    type: object
    properties:
      runEvery:
        type: integer
        format: int64
        description: Repeat schedule time
        example: 2
      timeUnit:
        $ref: '#/definitions/TimeUnit'
      endTime:
        type: string
        example: "23:59"
  Row:
    type: object
    properties:
      values:
        type: array
        items:
          $ref: '#/definitions/Value'
  ScheduleAutomationRequest:
    type: object
    properties:
      schedule:
        $ref: '#/definitions/SchedulerRequest'
      deployment:
        $ref: '#/definitions/DeploymentRequest'

  SchedulerRequest:
    type: object
    properties:
      status:
        $ref: '#/definitions/AutomationStatus'
      description:
        type: string
        description: Text describing the automation
        example: Schedule automation to run email bot.
      scheduleType:
        $ref: '#/definitions/ScheduleType'
      dailyRecurrence:
        $ref: '#/definitions/DailyRecurrence'
      timeZone:
        type: string
        description: Time zone where the schedule is set
        example: Asia/Calcutta
      startDate:
        type: string
        description: Start date of the automation.
        example: "2022-11-16"
      endDate:
        type: string
        description: End date of the automation.
        example: "2022-12-16"
      startTime:
        type: string
        description: Start time of the automation.
        example: "16:00"
      repeatEnabled:
        type: boolean
        description: Run the schedule repeatedly
      repeatOccurrence:
        $ref: '#/definitions/RepeatOccurrence'
      misfireScheduleConfig:
        type: boolean
        description : Controls how missed schedule executions are handled. This can occur if the scheduler is unable to run a job at its intended time due to unforeseen circumstances. If set to true, it will attempt to re-run the missed job as soon as possible. If set to false (default), it will disregard the missed execution and move on to the next scheduled time for the job.
      ownedBy:
        type: integer
        description: owner of schedule by default the creator of schedule is owner of schedule.
      scheduleResiliency:
        $ref: '#/definitions/ScheduleResiliency'

  ScheduleResiliency:
    type: object
    properties:
      common:
        type: object
        properties:
          detectAndNotify:
            type: object
            properties:
              enabled:
                type: boolean
              hideSensitiveInformation:
                type: boolean
            required:
              - enabled
              - hideSensitiveInformation
          recording:
            type: object
            properties:
              enabled:
                type: boolean
              botStatus:
                type: "string"
                example: "FAILED"
            required:
              - enabled
              - botStatus
          handleUnexpectedPopups:
            type: boolean
      recording:
        type: object
        properties:
          maxRecordingsForSchedule:
            type: integer

  DeploymentRequest:
    type: object
    required:
      - botId
      - deployInput
    properties:
      botId:
        type: integer
        description: Bot Id of bot to be deployed.
        example: 21
      automationName:
        type: string
        description: Name of the automation being deployed.
        example: SampleBot
      description:
        type: string
        description: Description of the automation being deployed.
        example: My first bot deploy using api
      botLabel:
        type: string
        description: Label for the bot being deployed.
      runElevated:
        type: boolean
        description: Specifies whether to deploy the bot with elevated permissions.
      hideBotAgentUi:
        type: boolean
        description: Specifies whether to hide the bot agent UI.
      callbackInfo:
        $ref: "#/definitions/CallbackInfo"
      automationPriority:
        $ref: "#/definitions/AutomationPriority"
      botInput:
        $ref: "#/definitions/Value"
      UnattendedRequest:
        $ref: "#/definitions/UnattendedRequest"


  AttendedRequest:
    type: object
    description: Attended deployments can be done on any device accessible by the user
    $ref: "#/definitions/attendedRequestObj"

  attendedRequestObj:
    type: object
    properties:
      deploymentDeviceId:
        type: integer
        description: unique id of the device on the which bot has to be executed.
      queueDeployment:
        type: boolean
        description: Specifies whether the deployment has to be queued
      launchInChildWindow:
        type: boolean
        description: Specifies whether the bot needs to launched in a child window on the device.

  UnattendedRequest:
    type: object
    description: Unattended deployments can be done on any devices associatged to the runAsUser
    $ref: "#/definitions/unattendedRequestObj"

  unattendedRequestObj:
    type: object
    required:
      - runAsUserIds
      - deviceUsageType
    properties:
      runAsUserIds:
        type: array
        items:
          type: integer
          description: List of runAs Users ids to deploy bot. The bot will be
            deployed on associated default device for each runAsUser or on 1
            of the devices from the device pool(s) if provided
          example: 639, 244
      poolIds:
        type: array
        items:
          type: integer
          description: List of pool Ids. The bot will be deployed in one of the device
            from pool(s) for each runAs User.
          example: 1, 2
      numOfRunAsUsersToUse:
        type: integer
        description: Used to indicate how many run as users should be used from the list of runAsUserIds provided.
          <li>System will pick the specified number of runAsUsers with the least number of tasks queued for the use at the moment of deploy request. </li>
          <li> If 0 then all the users will be used.</li>
          <li> If the number is greater than the number of runAsUsers provided or less than 0 it will error out.</li>
      deviceUsageType:
        type: string
        description: deviceUsageType specifies how the deployment devices have to be used.
          <li> PREFER_DEFAULT_DEVICE - If runner has default device and is busy will use device from pool. poolIds cannot be empty.</li>
          <li> RUN_ON_POOL_DEVICES - Deployment will use device from pool irrespective of user's default device. poolIds cannot be empty.</li>
          <li> RUN_ONLY_ON_DEFAULT_DEVICE - Deployment will use runner's default device even when pool(s) is provided. All user(s) must have default devices. </li>
        enum:
          - PREFER_DEFAULT_DEVICE
          - RUN_ON_POOL_DEVICES
          - RUN_ONLY_ON_DEFAULT_DEVICE

  HeadlessRequest:
    type: object
    description: Headless deployments can be done on any device pool by the user
    $ref: "#/definitions/headlessRequestObj"

  headlessRequestObj:
    type: object
    properties:
      numberOfExecutions:
        type: integer
        description: Number of executions to run for a given Headless request.
      sharedRunAsUserId:
        type: integer
        description: RunAsUser's id to deploy bot. The bot will be
          deployed on 1 of the devices from the provided device pool(s)
        example: 639
      queueOnSlotsExhaustion:
        type: boolean
        description: whether the deployment has to be queued

  CallbackInfo:
    type: object
    required:
      - url
    description: callbackInfo provides the callback API URL and authentication token for the callback server. The API parameters such as device ID, user ID, deployment ID, status of the bot, and bot output details are captured as a payload in the callback server.
      <p>After the bot is deployed, the Control Room sends the deployment status and output variable values to this callback server. For example, to test the callback, you can create an account in https://pipedream.com/ and use the endpoint (similar to https://eogp1yk2w1o3ec2.m.pipedream.net) to receive the status and the output variable values.</p>
      <p><b>Note:</b> The callback server must accept POST calls to receive the bot execution data and the deployment status from the Control Room. </p>
    properties:
      url:
        type: string
        description: Callback API URL.
      headers:
        type: object
        additionalProperties:
          type: string
