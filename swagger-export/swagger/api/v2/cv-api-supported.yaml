swagger: '2.0'
info:
  version: 1.0.0
  title: Credential Vault API
  description: The Credential Vault securely stores sensitive information such as passwords, account numbers, and social security numbers in credentials and lockers for use in automation tasks. It facilitates role-based access for users of a Control Room and ensures that sensitive values are not stored in bots or on devices. The Credential Vault consists of two main features, credentials and lockers. The Automation Anywhere platform provides a centralized Credential Vault to securely store all credentials and provision them to bots on an on-demand basis.<br>

    <b>Prerequisites</b> <br>
    <ul><li>Control Room user with **Manage my credentials and lockers** feature permissions, you have the option to use the Credential Vault API to manage your attributes, credentials, and lockers in the Control Room.</li></ul>
    All API calls must contain either an authentication token from Authentication API (generates JSON Web token) or a bearer token from OAuth services. You cannot use both together in an API.<br>
    **Header file example:** `-H X-Authorization <authentication token>` or `Authorization:Bearer <bearer token>`

schemes:
  - http
  - https
basePath: /v2/credentialvault
produces:
  - application/json
securityDefinitions:
  AccessToken:
    type: apiKey
    description: >
      **X-Authorization: _token_**
    name: X-Authorization
    in: header
security:
  - AccessToken: []
paths:
  /credentials:
    post:
      summary: Create credential
      description: Create new instance of credential
      consumes:
        - application/json
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/CredentialPost'
      tags:
        - Credentials
      responses:
        201:
          description: Credential created
          schema:
            $ref: '#/definitions/Credential'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        409:
          $ref: '#/responses/409'
        500:
          $ref: '#/responses/500'
  /credentials/list:
    post:
      summary: Search for credentials
      description: Search for credentials where a user is an owner or has access through a locker. If the user is locker admin returns all credentials in the system. Additional filtering, ordering and pagination rules can be requested.
      consumes:
        - application/json
      parameters:
        - name: consumed
          in: query
          type: boolean
          description: Filter credentials by fact if credential is userProvided and consumed by current user
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/FilterRequest'
      tags:
        - Credentials
      responses:
        200:
          description: Found credentials
          schema:
            $ref: '#/definitions/CredentialFilterResponse'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
  /credentials/{id}:
    get:
      summary: Get credential by id
      description: Return specific credential
      tags:
        - Credentials
      parameters:
        - $ref: '#/parameters/PathCredentialId'
      responses:
        200:
          description: Credential
          schema:
            $ref: '#/definitions/Credential'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
    put:
      summary: Update credential
      description: Update existing credential
      consumes:
        - application/json
      parameters:
        - $ref: '#/parameters/PathCredentialId'
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/Credential'
      tags:
        - Credentials
      responses:
        200:
          description: Crednetial updated
          schema:
            $ref: '#/definitions/Credential'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        409:
          $ref: '#/responses/409'
        500:
          $ref: '#/responses/500'
    delete:
      summary: Delete credential
      description: Delete credential and all related (standard and user-provided) attributes
      tags:
        - Credentials
      parameters:
        - $ref: '#/parameters/PathCredentialId'
      responses:
        204:
          description: Successful delete
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
  /credentials/{id}/owner/{credentialOwnerId}:
    put:
      summary: Update ownership of the credential
      description: Update ownership of the credential
      consumes:
        - application/json
      parameters:
        - $ref: '#/parameters/PathCredentialId'
        - $ref: '#/parameters/PathOwnerId'
      tags:
        - Credentials
      responses:
        204:
          description: Successful update of credential ownership
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        500:
          $ref: '#/responses/500'
  /credentials/{id}/attributevalues:
    get:
      summary: All credential attribute values of specific credential
      description: Return all credential attribute values (standard and user-provided) of specific credential, query parameters can be used only if user has special permission (View and edit ALL credentials attributes value) <br>
        <b>Note:</b> <p>In order to get the credentialAttributeValue for any user-provided credential, a query parameter UserId must be provided in the request with GET method and the UserId should belong to the user who has provided the credentials. For example </p>
        <code>GET https://{{ControlRoomURL}}/v2/credentialvault/credentials/25/attributevalues?credentialAttributeId=90&userId=452</code>
      tags:
        - AttributeValues
      parameters:
        - $ref: '#/parameters/PathCredentialId'
        - name: credentialAttributeId
          in: query
          type: string
          description: credential attribute id to which the value belongs too
        - name: userId
          in: query
          type: string
          description: id of the user, should be skipped for standard attribute
        - name: encryptionKey
          in: query
          type: string
          description: RSA public key. Used to encrypt values.
      responses:
        200:
          description: Credential attribute values found
          schema:
            $ref: '#/definitions/CredentialAttributeValueList'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
    post:
      summary: Create credential attribute values of specific credential
      description: Create credential attribute values for user-provided or standard attribute if user is allowed to create it
      consumes:
        - application/json
      parameters:
        - $ref: '#/parameters/PathCredentialId'
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/CredentialAttributeValuePostList'
        - name: encryptionKey
          in: query
          type: string
          description: RSA public key used to encrypt the value. The key has to be encoded in Base64. Has to be retrieved from CV API ({{Control Room url}}/v2/credentialvault/keys/transport/public).
      tags:
        - AttributeValues
      responses:
        201:
          description: Credential attribute values created
          schema:
            $ref: '#/definitions/CredentialAttributeValueList'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        409:
          $ref: '#/responses/409'
        500:
          $ref: '#/responses/500'
  /credentials/{id}/attributevalues/{attributeValueId}:
    put:
      summary: Update credential attribute value of specific credential
      description: Update existing instances of attribute value for specific credential. User can change his user-provided attribute value or common value if he is allowed to do it.
      consumes:
        - application/json
      parameters:
        - $ref: '#/parameters/PathCredentialId'
        - $ref: '#/parameters/PathAttributeValueId'
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/CredentialAttributeValuePut'
        - name: encryptionKey
          in: query
          type: string
          description: RSA public key used to encrypt the value. The key has to be encoded in Base64. Has to be retrieved from CV API ({{Control Room url}}/v2/credentialvault/keys/transport/public).
      tags:
        - AttributeValues
      responses:
        200:
          description: Credential attribute value updated
          schema:
            $ref: '#/definitions/CredentialAttributeValue'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        500:
          $ref: '#/responses/500'
    delete:
      summary: Delete credential attribute value of specific credential
      description: Delete credential attribute value of specific credential
      consumes:
        - application/json
      parameters:
        - $ref: '#/parameters/PathCredentialId'
        - $ref: '#/parameters/PathAttributeValueId'
      tags:
        - AttributeValues
      responses:
        204:
          description: Successful delete
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
  /lockers:
    post:
      summary: Create a locker
      description: Create a new instance of a locker
      consumes:
        - application/json
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/LockerPost'
      tags:
        - Lockers
      responses:
        201:
          description: Locker created
          schema:
            $ref: '#/definitions/Locker'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        409:
          $ref: '#/responses/409'
        500:
          $ref: '#/responses/500'
  /lockers/list:
    post:
      summary: Search for lockers
      description: Search for lockers where the current user is a member (owner, manager or participant) or has usage permission. If the user is locker admin returns all lockers in the system. Additional filtering, ordering and pagination rules can be requested. The result includes locker members and count of credentials inside each locker.
      consumes:
        - application/json
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/FilterRequest'
      tags:
        - Lockers
      responses:
        200:
          description: Found lockers
          schema:
            $ref: '#/definitions/LockerFilterResponse'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
  /lockers/{id}:
    get:
      summary: Get locker by id
      description: Return specific locker
      tags:
        - Lockers
      parameters:
        - $ref: '#/parameters/PathLockerId'
      responses:
        200:
          description: Locker
          schema:
            $ref: '#/definitions/Locker'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
    put:
      summary: Update locker
      description: Update existing locker
      consumes:
        - application/json
      parameters:
        - $ref: '#/parameters/PathLockerId'
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/Locker'
      tags:
        - Lockers
      responses:
        200:
          description: Locker updated
          schema:
            $ref: '#/definitions/Locker'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        409:
          $ref: '#/responses/409'
        500:
          $ref: '#/responses/500'
    delete:
      summary: Delete locker
      description: Delete locker and all related user-provided attributes
      tags:
        - Lockers
      parameters:
        - $ref: '#/parameters/PathLockerId'
      responses:
        204:
          description: Successful delete
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
  /lockers/{id}/consumers:
    get:
      summary: All locker's consumers
      description: Return all roles that can use credentials inside the locker
      tags:
        - Lockers
      parameters:
        - $ref: '#/parameters/PathLockerId'
      responses:
        200:
          description: Locker consumers
          schema:
            $ref: '#/definitions/LockerConsumerList'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
    post:
      summary: Add locker consumer
      description: Make the role able to use credentials inside the locker
      consumes:
        - application/json
      parameters:
        - $ref: '#/parameters/PathLockerId'
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/LockerConsumer'
      tags:
        - Lockers
      responses:
        204:
          description: Successful creation of locker consumer
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        409:
          $ref: '#/responses/409'
        500:
          $ref: '#/responses/500'
  /lockers/{id}/consumers/{roleId}:
    delete:
      summary: Remove locker consumer
      description: Make the role no longer able to use credentials inside the locker
      tags:
        - Lockers
      parameters:
        - $ref: '#/parameters/PathLockerId'
        - $ref: '#/parameters/PathRoleId'
      responses:
        204:
          description: Successful removal of locker consumer
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
  /lockers/{id}/members:
    get:
      summary: All locker's members
      description: Return all users that can add/remove credentials to the locker or edit the locker settings
      tags:
        - Lockers
      parameters:
        - $ref: '#/parameters/PathLockerId'
      responses:
        200:
          description: Locker members
          schema:
            $ref: '#/definitions/LockerMemberList'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
  /lockers/{id}/members/{userId}:
    put:
      summary: Add or update a locker member
      description: Make the user able to add/remove credentials to the locker or edit the locker settings
      consumes:
        - application/json
      parameters:
        - $ref: '#/parameters/PathLockerId'
        - $ref: '#/parameters/PathUserId'
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              permissions:
                $ref: '#/definitions/LockerMemberPermissions'
      tags:
        - Lockers
      responses:
        204:
          description: Successful creation/update of locker member
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        409:
          $ref: '#/responses/409'
        500:
          $ref: '#/responses/500'
    delete:
      summary: Remove locker member
      description: Make the user no longer able to add/remove credentials to the locker or edit the locker settings
      tags:
        - Lockers
      parameters:
        - $ref: '#/parameters/PathLockerId'
        - $ref: '#/parameters/PathUserId'
      responses:
        204:
          description: Successful removal of locker member
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
  /lockers/{id}/credentials:
    get:
      summary: All locker's credentials
      description: Return all credentials that belong to the locker filtered by permissions of current user
      tags:
        - Lockers
      parameters:
        - $ref: '#/parameters/PathLockerId'
      responses:
        200:
          description: Locker credentials
          schema:
            $ref: '#/definitions/CredentialAdvancedList'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
  /lockers/{id}/credentials/{credentialId}:
    put:
      summary: Add credential to the locker
      description: Add your own credential to a locker where you're owner, manager or participant
      tags:
        - Lockers
      parameters:
        - $ref: '#/parameters/PathLockerId'
        - $ref: '#/parameters/PathCredentialIdInLocker'
      responses:
        204:
          description: Credential has been added to the locker
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
    delete:
      summary: Remove credential from the locker
      description: Remove credential from the locker where you're owner or manager
      tags:
        - Lockers
      parameters:
        - $ref: '#/parameters/PathLockerId'
        - $ref: '#/parameters/PathCredentialIdInLocker'
      responses:
        204:
          description: Credential has been removed from the locker
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
  /mode:
    get:
      summary: Get current CredentialVault mode
      description: CredentialVault can be in Express or Manual modes. Requires Admin rights to execute this API.
      tags:
        - Mode
      responses:
        200:
          description: CV Mode has been successfully received
          schema:
            $ref: '#/definitions/Mode'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
    put:
      summary: Update CredentialVault mode to Express or Manual
      description: In Manual mode the system will require input of Private (Master) key after CR restart, it's required to unlock CredentialVault
      tags:
        - Mode
      consumes:
        - application/json
      parameters:
        - name: mode
          in: body
          description: New mode to set CredentialVault to
          required: true
          schema:
            $ref: '#/definitions/ModePut'
      responses:
        204:
          description: Mode has been successfully set
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
  /keys:
    post:
      summary: Generates Public/Private key pair
      description: Generate Public/Private key pair after a fresh CR installation. The generated keys are saved automatically, it needs to be done with a different endpoint. Once a key pair is saved no more keys can be generated.
      tags:
        - Keys
      responses:
        200:
          description: Keys are generated, body contains both Private and Public keys
          schema:
            $ref: '#/definitions/Keys'
        400:
          description: Bad Request, another key pair has already been generated and saved
          schema:
            $ref: '#/definitions/Error'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
    put:
      summary: Saves Public/Private key pair and Mode
      description: Save Public/Private key pair and Mode after a fresh CR installation once the CR Admin user is created. The key pair to be saved needs to be generated with a different endpoint. Unpon saving the keys a Data key is generated and saved as well and CredentialVault is opened automatically.
      tags:
        - Keys
      consumes:
        - application/json
      parameters:
        - name: keys
          in: body
          description: Public/Private key pair with Mode
          required: true
          schema:
            $ref: '#/definitions/KeysWithMode'
      responses:
        204:
          description: Keys are saved
        400:
          description: Bad Request, invalid input parameters or another key pair has already been saved
          schema:
            $ref: '#/definitions/Error'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
  /keys/private:
    get:
      summary: Check the private key status
      description: Check to see if the private has been applied or not, should be used to check CredentialVault status. If Private key has been applied it means that CredentialVault is in Opened status.
      tags:
        - Keys
      responses:
        200:
          description: Private key status
          schema:
            $ref: '#/definitions/PrivateKeyStatus'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        500:
          $ref: '#/responses/500'
    put:
      summary: Use Private (Master) key to unlock CredentialVault
      description: Use Private (Master) key to unlock CredentialVault after the Control Room restarts in Manual mode. Available Private key means that CredentialVault is open (connected) and the system is ready.
      tags:
        - Keys
      consumes:
        - application/json
      parameters:
        - name: privateKey
          in: body
          description: Private (Master) key is required to unlock CredentialVault in Manual mode
          required: true
          schema:
            $ref: '#/definitions/PrivateKey'
      responses:
        204:
          description: Private key has been successfully applied
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        404:
          $ref: '#/responses/404'
        500:
          $ref: '#/responses/500'
  /keys/transport/public:
    get:
      summary: Get RSA public key encoded with Base64.
      description: Use this API to get RSA public key encoded with Base64. The key should be used by a client of CV API to entrypt credential values. It can be used only for create/update operations.
      tags:
        - Keys
      responses:
        200:
          description: Base64 encoded RSA public key
          schema:
            $ref: '#/definitions/PublicKey'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        500:
          $ref: '#/responses/500'
  /loginsetting:
    put:
      summary: Create or update device login setting
      description: Use this API to set login credentials for a user to acquire session on the device when a bot is deployed.
      tags:
        - Login setting
      consumes:
        - application/json
      parameters:
        - name: body
          in: body
          description: Credentials to acquire user session on the device
          required: true
          schema:
            $ref: '#/definitions/LoginSettingPut'
      responses:
        200:
          description: Credentials updated for 'user'
        400:
          $ref: '#/responses/400'
        401:
          $ref: '#/responses/401'
        403:
          $ref: '#/responses/403'
        500:
          $ref: '#/responses/500'
definitions:
  CredentialPost:
    type: object
    required:
      - name
    properties:
      name:
        type: string
        description: Name of credential
      description:
        type: string
        description: Description of credential
      attributes:
        type: array
        items:
          $ref: '#/definitions/CredentialAttributePost'
  Credential:
    type: object
    required:
