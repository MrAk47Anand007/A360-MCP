        description: Login username (username or domain\username). To enter details for AD Control Rooms, use the domain\username format. When using an API client that does not support the domain\username format, you can add an additional backslash character to the username. This will escape the backslash character and prevent it from being interpreted as a special character by the API client. For example, domain\\\username.
