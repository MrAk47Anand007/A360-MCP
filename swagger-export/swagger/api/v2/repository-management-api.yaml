openapi: 3.0.1
info:
  title: Repository Management API
  description: |-
    Use the Repository Management APIs to perform specific tasks on objects (bots, folders, and files) that you have permission to access in the Control Room. Automation 360 repository consists of private and public workspaces, which contain folders of bots and their dependency files.
    The private workspace holds objects that are only accessible to the logged-in user. Bots in the private workspace can only be run on that user's device. The public workspace holds objects that are accessible to all users who have the necessary permissions. When a bot is checked-in from a private workspace to the public workspace, it can be checked out by another user to their private workspace for editing or deployed to a Bot Runner.
    > **Note:** <li>To view objects in your private workspace, you must have a Bot Creator license and a role that includes the <i>View my bots</i> feature permission.</li> <li>To view objects in the public workspace, you must be assigned a role that includes the <i>View my bots</i> feature permission and the <i>View content</i> bot permission to folders in the public workspace.</li>

    All API calls must contain either an authentication token from Authentication API (generates JSON Web token) or a bearer token from OAuth services. You cannot use both together in an API.<br>
    **Header:** `X-Authorization: <<authentication token>> or Authorization: Bearer <<bearer token>>`
  version: 2.0.0
servers:
- url: /v2/repository
security:
- AccessToken: []
paths:
  /file/list:
    post:
      tags:
      - Repository
      summary: "Lists bots, folders, and files in a repository"
      description: "Use the List API to view details of all the objects (bots, folders,\
        \ and files) in the Control Room.  \n\n  You can send an API request with\
        \ or without filter parameters. An API request without any filter parameters\
        \ specified, retrieves details of all the objects in the Control Room. You\
        \ can use the filter parameters to retrieve specific set of file or folder\
        \ objects, instead of fetching all objects in the Control Room. For more information,\
        \ see [Filtering, pagination, and sorting](https://docs.automationanywhere.com/bundle/enterprise-v2019/page/enterprise-cloud/topics/control-room/control-room-api/cloud-api-filter-request.html).\n\
        \ \n  For example, to view details of a specific bot, use 'eq' or 'substring'\
        \ operator with field as 'name' and bot name in the 'value' of the filter.\
        \ This filter will get bot details of all the bots matching the bot name provided.\n\
        \  >> **Note:** The ID and Parent ID that is specified the the response output\
        \ is used in other endpoints to create subfolders, delete folder etc."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterRequest'
        required: true
      responses:
        "200":
          description: "Returns a list of bots, files, or folders; or a blank list\
            \ as per filter conditions specified."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotsResponse'
            application/vnd.aa.form:
              schema:
                $ref: '#/components/schemas/BotsResponse'
            application/vnd.aa.taskbot:
              schema:
                $ref: '#/components/schemas/BotsResponse'
            application/vnd.aa.headlessbot:
              schema:
                $ref: '#/components/schemas/BotsResponse'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/BotsResponse'
        "400":
