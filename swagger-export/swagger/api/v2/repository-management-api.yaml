components:
  schemas:
    FilterRequest:
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/Filter'
        sort:
          type: array
          description: Sort directions
          items:
            $ref: '#/components/schemas/Sort'
        page:
          $ref: '#/components/schemas/PageRequest'
      description: "Filter request, which includes filtering, sorting, and pagination\
        \ rules"
    Sort:
      type: object
      properties:
        field:
          type: string
          description: Field name to sort by
          example: name
        direction:
          type: string
          description: Sorting direction
          enum:
          - asc
          - desc
      description: "By default, search results are sorted in descending order with\
        \ respect to their IDs. An alternative sorting is specified by using the sort\
        \ query parameter."
    PageRequest:
      type: object
      properties:
        offset:
          type: integer
          description: Page starting index
        length:
          type: integer
          description: Page length
          example: 100
      description: "Pagination rules, allows you to filter based on desired page"
    Filter:
      type: object
      properties:
        operator:
          type: string
          description: Operator
          example: or
          enum:
          - NONE
          - lt
          - le
          - eq
          - ne
          - ge
          - gt
          - substring
          - and
          - or
          - not
        operands:
          type: array
          example:
            - operator: substring
              field: name
              value: new
            - operator: substring
              field: name
              value: marks
          items:
            $ref: '#/components/schemas/Filter'

    FoldersAndFilesFilterResponse:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/PageResponse'
        list:
          type: array
          description: list of directories & files.
          items:
            $ref: '#/components/schemas/File'
    PageResponse:
      type: object
      properties:
        offset:
          type: integer
          description: "The starting list offset, used for pagination."
        total:
          type: integer
          description: Total number of items
          example: 4525
        totalFilter:
          type: integer
          description: Total number of items matching filter
          example: 1
      description: Pagination response
    File:
      type: object
      properties:
        id:
          type: string
          description: Folder identifier
          example: "155524"
        parentId:
          type: string
          description: Parent folder identifier
          example: "108889"
        name:
          type: string
          description: Name of file or folder
          example: my_bots
        folder:
          type: boolean
          description: Whether the specified type is a folder or not
        folderCount:
          type: string
          description: Number of sub-folders
          example: 2.0
        productionVersion:
          type: string
          description: Current production version of the bot (applicable only with
            VCS ON)
          example: "1"
        latestVersion:
          type: string
          description: Latest version of the bot (applicable only with VCS ON)
          example: "2"
        type:
          type: string
          description: "The content type, also known as MIME type of the file"
          example: application/vnd.aa.directory
        path:
          type: string
          description: Path of the file or folder in the repository
          example: Automation Anywhere\Bots
        size:
          type: string
          description: Size of the file. Available only if the item type is file
          example: "450"
        lockedBy:
          type: string
          description: File locked by information. Available only if the item type
            is bot and VCS is 'ON'.
          example: "null"
        locked:
          type: boolean
          description: Whether the file is locked or not. Available only if the item
            type is file
          example: false
        lastModified:
          type: string
          description: Date and time when the bot was last updated
          example: 2025-07-22T10:49:14.602816Z
        lastModifiedBy:
          type: string
          description: ID of the user who last updated the Bot/file
          example: "97"
        permission:
          $ref: '#/components/schemas/Permission'
        createdBy:
          type: string
          description: ID of the user who created the Bot/file
          example: "97"
        workspaceId:
          type: string
          description: Unique workspace id of user. A workspaceId of 0 indicates the
            PUBLIC workspace. All others are considered as PRIVATE workspace.
          example: 21
        botStatus:
          type: string
          description: "Status of the Bot [DRAFT, NEW, PUBLIC, CHECKED_OUT, CLONED]"
          example: NEW
        hasErrors:
          type: boolean
          description: Whether the specified file or folder contains errors
          example: false
        workspaceType:
          type: string
          description: Type of the workspace which is either PUBLIC or PRIVATE
          example: PUBLIC
        metadata:
          type: boolean
          description: Whether the specified file or folder is metadata
          example: false
        uri:
          type: string
          description: Universal resourse identifier for the file/folder
        version:
          type: string
          description: Version of the bot
          example: "0"
        hasTriggers:
          type: boolean
          description: Indicates whether the Bot has any triggers set
        isEdited:
          type: boolean
          description: Indicates whether the Bot is previously edited
          example: false
        versionNumber:
          type: string
          description: File version. Only available in case the item type is bot
          example: 0
        botVersionLabel:
          type: string
          description: Label version of the bot. Only available in case the item type
            is bot
          example: PRODUCTION
        originalVersion:
          type: string
          description: The actual version of the file or folder.
          example: 1.0
        codeAnalysisResult:
          type: string
          description: Code analysis result of a bot
          enum:
          - NOT_APPLICABLE
          - NOT_SCANNED
          - NO_VIOLATIONS
          - LOW_SEVERITY_VIOLATIONS
          - HIGH_SEVERITY_VIOLATIONS
        uuid:
          type: string
          description: Unique identifier for the file or folder
          example: ""
        createdFromFilePath:
          type: string
          description: The file path from which the current file or folder was created
        createdFromFileVersion:
          type: string
          description: The version of the file from which the current file or folder was created
          example: "1.0"
        gitRepositoryFolder:
          type: boolean
          description: Whether the current file or folder is part of a Git repository
          example: false
        author:
          type: string
          description: The author of the file or folder
        tags:
          type: array
          description: Tags associated with the file or folder
          example: []
        typeLabel:
          type: string
          description: The type label of the file or folder
          example: "FOLDER"

      description: File or folder

    Permission:
      type: object
      properties:
        delete:
          type: boolean
          description: Indicates if the current logged in user has permission to delete
            the bot
        download:
          type: boolean
          description: Indicates if the current logged in user has permission to download(check-out)
            the bot
        clone:
          type: boolean
          description: Indicates if the current logged in user has permission to clone
            the bot
        upload:
          type: boolean
          description: Indicates if the current logged in user has permission to upload(check-in)
            the bot
        run:
          type: boolean
          description: Indicates if the current logged in user has permission to run\schedule
            the bot
        viewContent:
          type: boolean
          description: Indicates if the current logged in user has permission to view
            the bot content (bot logic).
        publishBotstore:
          type: boolean
          description: Indicates if the current logged in user has permission to publish
            the bot to botstore.
        editContent:
          type: boolean
          description: Indicates if the current logged in user has permission to modify
            a bot.
        createFolder:
          type: boolean
          description: Indicates if the current logged in user has permission to create
            a folder.
        move:
          type: boolean
          description: Indicates if the current logged in user has permission to move
            the bot to another folder.
        cancelCheckout:
          type: boolean
          description: Indicates if the current logged in user has permission to cancel
            checkout for the bot.
        revertCheckout:
          type: boolean
          description: Indicates if the current logged in user has permission to revert
            check out for the bot.
        viewHistory:
          type: boolean
          description: Indicates if the current logged in user has permission to view
            history for the bot.
        labelBots:
          type: boolean
          description: Indicates if the current logged in user has permission to label
            the bot.
    Bot:
      type: object
      properties:
        id:
          type: string
          description: "The unique ID of the displayed objects (bots, folders, or\
            \ files)"
          example: "155524"
        parentId:
          type: string
          description: The unique ID of the parent folder
          example: "108889"
        name:
          type: string
          description: "Name of the bot, file, or folder"
          example: new marks bots
        permission:
          $ref: '#/components/schemas/BotPermission'
        lastModified:
          type: string
          description: Date and time of last update
          example: 2025-07-19T23:08:49.150494Z
        lastModifiedBy:
          type: string
          description: ID of the user who last updated the bot or file
          example: "275"
        path:
          type: string
          description: Path of the file or folder in the repository
          example: Automation Anywhere\Bots\new marks bots
        directory:
          type: boolean
          description: Flag for directory
          example: false
        size:
          type: string
          description: Size in KB
          example: 947
        locked:
          type: boolean
          description: Indicates whether the file is locked (applicable only with
            VCS ON)
          example: false
        productionVersion:
          type: string
          description: Current production version of the bot (applicable only with
            VCS ON)
          example: "null"
        lockedBy:
          type: string
          description: User id who has locked the bot (applicable only with VCS ON)
          example: "0"
        latestVersion:
          type: string
          description: Latest version of the bot (applicable only with VCS ON)
          example: "3"
        fileLastModified:
          type: string
          description: Date and time when the bot was last updated
          example: 2025-07-19T23:08:49.150494Z
    BotPermission:
      type: object
      properties:
        delete:
          type: boolean
          description: Indicates if the current logged in user has rights to delete
            the bot
        download:
          type: boolean
          description: Indicates if the current logged in user has rights to download
            (check-out) the bot
        upload:
          type: boolean
          description: Indicates if the current logged in user has rights to upload
            (check-in) the bot
        run:
          type: boolean
          description: Indicates if the current logged in user has rights to run or
            schedule the bot
    BotsResponse:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/PageResponse'
        list:
          type: array
          description: list of bots.
          items:
            $ref: '#/components/schemas/Bot'
    Error:
      type: object
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Message describing error
    FolderListSpecificError:
      type: object
      properties:
        code:
          type: string
          description: Corresponding Error code for error message.
        message:
          type: string
          description: Message describing error.
        details:
          type: string
          description: More details of the error message.
        correctiveAction:
          type: string
          description: Corrective action to be taken to get rid of this error.
    HttpStatusCode:
      type: string
      description: Status code("OK")
    path:
      type: string
      description: File path
    RepositoryPermissions:
      type: array
      description: List of folder permissions
      items:
        $ref: '#/components/schemas/FolderPermission'
    FolderPermission:
      type: object
      properties:
        folderId:
          type: integer
          example: 14
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/RepoRolePermission'
    RepoRolePermission:
      type: object
      properties:
        name:
          type: string
          enum:
          - clone
          - update
          - download
          - delete
          - run
          - viewcontent
        enabled:
          type: boolean
    FileParentsResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique ID of the file
          example: "1008"
        name:
          type: string
          description: Name of the File
          example: sample.txt
        path:
          type: string
          description: Relative path of the file
          example: Automation Anywhere\\Bots\\Example_bots\\sample.txt
        size:
          type: number
          description: Size of the file. Only available in case the item type is file
          example: 72.0
        type:
          type: string
          description: "The content type, also known as MIME type, of the file"
          example: text/plain
        dependencyType:
          type: string
          description: "The type of the related object. NONE - If the bot or file\
            \ does not have a parent, then the API will return the same bot or file.\
            \ SCANNED - It is the relation with the child bots or files which are\
            \ scanned and found automatically. MANUAL - It is the relation with the\
            \ bots or files that are added to the parent bot manually."
          example: NONE
        url:
          type: string
          description: URL of the bot or file
          example: https://contorlroom.com/v1/repository/97/1008/download?version=latest
        requiredByFileId:
          type: number
          description: Parent file or folder id
        lockedBy:
          type: string
          description: "User ID who has locked the bot [Applicable to checked out\
            \ file]"
          example: "0"
        botStatus:
          type: string
          description: "Status of the Bot [Public/Checkout/New/Clone]"
          example: New
        permission:
          $ref: '#/components/schemas/Permission'
        versionNumber:
          type: number
          description: File version. Only available in case the item type is bot
          example: 0.0
        label:
          type: string
          description: File label
          example: "null"
      description: Bot or File
    CreateFolderRequest:
      type: object
      properties:
        folderName:
          type: string
          description: Name of the new folder you want to create
          example: my_bots
    EditFolderRequest:
      type: object
      properties:
        folderId:
          type: string
          description: Unique ID of the folder you want to edit the details
          example: "164086"
        name:
          type: string
          description: Name of the folder
          example: my_bots
        description:
          type: string
          description: Description of the folder
          example: My sample bots
        parentId:
          type: string
          description: Unique ID of the parent folder
          example: "14"
    EditFileDependenciesRequest:
      type: object
      properties:
        childFileIds:
          type: array
          description: Indicates the child file IDs that must be added as a dependency
            to the specified parent file ID.
          items:
            type: integer
    FileDependency:
      type: object
      properties:
        id:
          type: string
          description: Unique ID of the file
          example: "1008"
        name:
          type: string
          description: Name of the file
          example: sample.txt
        path:
          type: string
          description: Path of the file in the repository
          example: Automation Anywhere\\Bots\\Example_bots\\sample.txt
        size:
          type: string
          description: Size of the file. Only available in case the item type is file
          example: "72"
        type:
          type: string
          description: "The content type, also known as MIME type, of the file"
          example: text/plain
        dependencyType:
          type: string
          description: "The type of the related object. NONE - If the bot or file\
            \ does not have a parent, then the API will return the same bot or file.\
            \ SCANNED - It is the relation with the child bots or files which are\
            \ scanned and found automatically. MANUAL - It is the relation with the\
            \ bots or files that are added to the parent bot manually."
          example: NONE
        url:
          type: string
          description: URL of the bot or file
          example: https://contorlroom.com/v1/repository/97/1008/download?version=latest
        requiredByFileId:
          type: string
          description: Parent file or folder id
          example: "0"
        lockedBy:
          type: string
          description: User ID who had locked the File. Only available in case the
            item type is bot and VCS is 'ON'.
          example: "0"
        botStatus:
          type: string
          description: "Status of the Bot [Public/Checkout/New/Clone]"
          example: New
        permission:
          $ref: '#/components/schemas/Permission'
        versionNumber:
          type: string
          description: File version
          example: "0"
        label:
          type: string
          description: File label
          example: "null"
      description: File dependency
    FileDependencyResponse:
      type: object
      properties:
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/FileDependency'
    PackageVersionUpdateInfo:
      type: object
      properties:
        package_name:
          type: string
          description: Name of the package
          example: MessageBox
        package_version:
          type: string
          description: Version of the package
          example: 2.0.0-20200716-211611
      description: Package version update information
    PackageVersionUpdateRequestV2:
      type: object
      properties:
        name:
          type: string
          description: Name of the request
          example: Test
        description:
          type: string
          description: Description of the request
          example: Test description
        package_info:
          type: array
          items:
            $ref: '#/components/schemas/PackageVersionUpdateInfo'
        file_ids:
          type: array
          description: List of the file ids
          items:
            type: integer
        downgrade_version:
          type: boolean
          description: True if the package version downgrade is allowed
          example: true
        label:
          type: string
          description: File label
          example: Production
      description: Package version update request
    RepositoryRecoveryRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the recover activity
          example: Recover1
        sourceUserId:
          type: integer
          description: Unique ID of the deleted user
        targetUserId:
          type: integer
          description: Unique ID of the target user
      description: Repository recover request
    AssignLabelForProduction:
      type: object
      properties:
        fileId:
          type: integer
          description: Unique ID of the file
          example: 545
        label:
          type: string
          description: File Label.
          example: PRODUCTION
        versionNumber:
          type: integer
          description: File version. Only available in case the item type is bot
          example: 1
      description: "Label a version of bot for production request, Currently only\
        \ PRODUCTION is supported."
  responses:
